<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- fundo cheio: o sistema recorta os cantos; o desenho fica dentro da area segura central -->
  <rect width="512" height="512" fill="#0A0E13"/>
  <!-- escudo do clube -->
  <path d="M256 104l118 40v92c0 74-50 130-118 162-68-32-118-88-118-162v-92z"
        fill="#111820" stroke="#2FCB86" stroke-width="14" stroke-linejoin="round"/>
  <!-- barras subindo: o fundo valorizando o clube -->
  <rect x="190" y="262" width="30" height="58" rx="4" fill="#2FCB86" opacity=".55"/>
  <rect x="241" y="226" width="30" height="94" rx="4" fill="#2FCB86" opacity=".8"/>
  <rect x="292" y="184" width="30" height="136" rx="4" fill="#2FCB86"/>
  <!-- linha de base -->
  <rect x="176" y="330" width="160" height="10" rx="5" fill="#DDB04A"/>
</svg>
