<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080C11">
<meta name="description" content="Imperio FC - compre, administre e faca crescer clubes de futebol.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Imperio FC - fundo de clubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080C11; --bg2:#0D141C; --panel:#111A24; --panel2:#17222E;
  --line:#22303F; --chalk:#E9EDF2; --muted:#7E93A8;
  --ouro:#D9A441; --teal:#2E9E8F; --ok:#3DBB7E; --ama:#F2C14E; --err:#D9453B;
  --disp:'Anton',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  --data:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--chalk);font-family:var(--body)}
body{overscroll-behavior:none}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:82px}

.topo{position:sticky;top:0;z-index:40;background:linear-gradient(160deg,#16222E 0%,#0A1017 66%);
  border-bottom:1px solid var(--line);padding:11px 14px 10px;display:flex;gap:11px;align-items:center}
.topo:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:repeating-linear-gradient(90deg,var(--ouro) 0 18px,transparent 18px 36px);opacity:.55}
.topo .esc{width:34px;height:34px;font-size:13px}
.topo .nm{font-family:var(--disp);font-size:17px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.topo .sb{font-family:var(--data);font-size:11.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
.topo .dir{margin-left:auto;text-align:right;font-family:var(--data)}
.topo .dir b{display:block;font-size:15px;font-weight:700}
.topo .dir span{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.neg{color:var(--err)}.pos{color:var(--ok)}

.wrap{padding:13px}
.sec{font-family:var(--data);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  margin:19px 2px 8px;display:flex;align-items:center;gap:8px}
.sec:first-child{margin-top:3px}
.sec:before{content:"";width:13px;height:1px;background:var(--ouro)}
.sec i{margin-left:auto;font-style:normal;letter-spacing:.8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card+.card{margin-top:8px}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.5px;text-transform:uppercase;margin:0}
h3{font-size:19px}
.mono{font-family:var(--data);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.row{display:flex;align-items:center;gap:9px}
.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.kpi span{font-family:var(--data);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);display:block}
.kpi b{font-family:var(--data);font-size:18px;font-weight:700;display:block;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--ouro);color:#080C11;
  font-family:var(--data);font-weight:700;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;
  padding:13px 15px;border-radius:var(--r);width:100%;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.sec2{background:transparent;border:1px solid var(--line);color:var(--chalk)}
.btn.gh{background:var(--panel2);color:var(--chalk)}
.btn.mini{padding:8px 11px;font-size:12px;width:auto}
.btn[disabled]{opacity:.38;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--data);font-size:12px;letter-spacing:.8px;text-transform:uppercase;padding:6px 10px;
  border:1px solid var(--line);border-radius:20px;color:var(--muted);background:var(--panel)}
.chip.on{border-color:var(--ouro);color:var(--ouro)}
input[type=text],input[type=number]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px;font-size:16px;color:var(--chalk);outline:none}
input[type=text]:focus,input[type=number]:focus{border-color:var(--ouro)}
input[type=range]{width:100%;accent-color:var(--ouro)}

.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ouro)}
.bar.g i{background:var(--ok)}.bar.r i{background:var(--err)}.bar.t i{background:var(--teal)}

table{width:100%;border-collapse:collapse;font-family:var(--data);font-variant-numeric:tabular-nums}
th{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 3px;text-align:right;border-bottom:1px solid var(--line)}
th:nth-child(2){text-align:left}
td{padding:6px 3px;font-size:13.5px;text-align:right;border-bottom:1px solid rgba(34,48,63,.55)}
td:nth-child(2){text-align:left;font-family:var(--body);font-size:13.5px}
tr.eu td{background:rgba(217,164,65,.13);font-weight:700}
.zn{display:inline-block;width:3px;height:14px;vertical-align:-3px;margin-right:6px;border-radius:2px;background:transparent}
.zn.sob{background:var(--ok)}.zn.des{background:var(--err)}.zn.con{background:var(--teal)}

.li{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-bottom:0;background:var(--panel);width:100%;text-align:left}
.li:first-of-type{border-radius:var(--r) var(--r) 0 0}
.li:last-of-type{border-bottom:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.li .p{flex:1;min-width:0}
.li .p b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .p span{font-family:var(--data);font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.li .v{font-family:var(--data);font-size:13px;text-align:right;white-space:nowrap}
.ovr{font-family:var(--data);font-weight:700;font-size:16px;min-width:27px;text-align:center}
.pz{font-family:var(--data);font-size:9.5px;font-weight:700;letter-spacing:.6px;padding:2px 5px;border-radius:2px;background:var(--panel2);color:var(--muted)}
.pz.G{color:#F2C14E}.pz.D{color:#6FB1E8}.pz.M{color:#3DBB7E}.pz.A{color:#E8622C}
.esc{border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--disp);letter-spacing:.5px;border:1px solid rgba(255,255,255,.16)}
.tag{font-family:var(--data);font-size:9.5px;font-weight:700;letter-spacing:.6px;padding:2px 6px;border-radius:2px}
.tag.ok{background:#123024;color:var(--ok)}.tag.al{background:#33290D;color:var(--ama)}
.tag.er{background:#33110F;color:#F09189}.tag.nu{background:var(--panel2);color:var(--muted)}
.tag.ou{background:#2E230D;color:var(--ouro)}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:#0A1017;border-top:1px solid var(--line);
  display:flex;max-width:540px;margin:0 auto;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
  font-family:var(--data);font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;padding:4px 0}
.nav button.on{color:var(--ouro)}
.nav svg{width:20px;height:20px}
.nav .pt{position:absolute;top:2px;margin-left:20px;width:6px;height:6px;border-radius:50%;background:var(--err)}

.mod{position:fixed;inset:0;z-index:60;background:rgba(2,5,8,.82);display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:var(--bg2);border:1px solid var(--line);border-radius:10px 10px 0 0;width:100%;max-width:540px;
  max-height:88vh;overflow:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.hero{padding:38px 16px 16px;text-align:center}
.hero h1{font-size:42px;line-height:.88;letter-spacing:1px}
.hero h1 em{font-style:normal;color:var(--ouro);display:block}
.hero p{color:var(--muted);font-family:var(--data);letter-spacing:1.8px;text-transform:uppercase;font-size:11px;margin:10px 0 0}
.fd{animation:fd .25s}
@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  n = Math.round(n);

function abrevDe(nome, usados) {
  const limpo = nome.normalize('NFD').replace(/[^A-Za-z ]/g, '');
  const p = limpo.split(' ').filter(w => w.length > 1 || /^[A-Z]$/.test(w));
  const cand = [];
  if (p[0]) cand.push(p[0].slice(0, 3));
  if (p.length >= 3) cand.push(p[0][0] + p[1][0] + p[2][0]);
  if (p.length >= 2) cand.push(p[0].slice(0, 2) + p[1][0]);
  if (p.length >= 2) cand.push(p[0][0] + p[1].slice(0, 2));
  if (p[1]) cand.push(p[1].slice(0, 3));
  if (p[0]) cand.push(p[0].slice(0, 2) + (p[0][3] || p[0][2] || 'X'));
  if (p[0]) cand.push(p[0].replace(/[aeiouAEIOU]/g, '').slice(0, 3));
  if (p[1]) cand.push(p[1].replace(/[aeiouAEIOU]/g, '').slice(0, 3));
  for (const c of cand) {
    const ab = c.toUpperCase();
    if (ab.length === 3 && !usados[ab]) { usados[ab] = 1; return ab; }
  }
  let base = (p[0] || 'CLU').slice(0, 2).toUpperCase(), k = 1, ab;
  do { ab = base + (k++); } while (usados[ab]);
  usados[ab] = 1;
  return ab;
}

function calendarioDiv(ids) {
  const n = ids.length, fixo = ids[0];

    const lista = [fixo].concat(rot), jogos = [];
    for (let i = 0; i < n / 2; i++) {
      const a = lista[i], b = lista[n - 1 - i];
      jogos.push((r + i) % 2 === 0 ? { casa: a, fora: b } : { casa: b, fora: a });
    }
    turno.push(jogos); rot.unshift(rot.pop());
  }
  for (let i = turno.length - 1; i > 0; i--) { const j = ri(0, i); const t = turno[i]; turno[i] = turno[j]; turno[j] = t; }
  return turno.concat(turno.map(rr => rr.map(j => ({ casa: j.fora, fora: j.casa }))))
    .map(rr => rr.map(j => ({ casa: j.casa, fora: j.fora, pl: null })));
}

function marcarStat(c, gp, gc) {
  c.st.j++; c.st.gp += gp; c.st.gc += gc;
  if (gp > gc) { c.st.v++; c.st.pts += 3; } else if (gp === gc) { c.st.e++; c.st.pts++; } else c.st.d++;
}
function registrar(jogo, gA, gB) {
  jogo.pl = [gA, gB];
  marcarStat(S.clubes[jogo.casa], gA, gB);
  marcarStat(S.clubes[jogo.fora], gB, gA);
  invalidarTabelas();
}
function simularJogo(jogo, pularMeus) {
  if (jogo.pl) return;
  if (pularMeus && (ehMeu(jogo.casa) || ehMeu(jogo.fora))) return;
  const A = S.clubes[jogo.casa], B = S.clubes[jogo.fora];
  registrar(jogo, poisson(golsEsperados(A.nivel + 4, B.nivel)), poisson(golsEsperados(B.nivel, A.nivel + 4)));
}
function simularRodadaMundo(r) {
  for (let d = 0; d < S.cal.length; d++) {
    if (!S.cal[d][r]) continue;
    S.cal[d][r].forEach(g => simularJogo(g, true));
  }
}
function completarLigas() {
  for (let d = 0; d < S.cal.length; d++)
    for (let r = 0; r < S.cal[d].length; r++)
      S.cal[d][r].forEach(g => simularJogo(g, false));
}
let TB_CACHE = {};
function invalidarTabelas() { TB_CACHE = {}; }
function tabelaDiv(d) {
  if (TB_CACHE[d]) return TB_CACHE[d];
  const t = S.clubes.filter(c => c.div === d).slice().sort((a, b) =>
    b.st.pts - a.st.pts || (b.st.gp - b.st.gc) - (a.st.gp - a.st.gc) || b.st.gp - a.st.gp || a.nome.localeCompare(b.nome));
  TB_CACHE[d] = t;
  return t;
}
function posDe(c) {
  const i = tabelaDiv(c.div).findIndex(x => x.id === c.id);
  return i < 0 ? 10 : i + 1;
}
function jogoDaRodada(k, r) {
  const lista = S.cal[divDe(k)][r];
  if (!lista) return null;
  return lista.filter(g => g.casa === k.id || g.fora === k.id)[0] || null;
}
function subirDescer() {
  for (let d = 0; d < 3; d++) {
    const tb = tabelaDiv(d);
    if (d > 0) tb.slice(0, 4).forEach(c => c.novaDiv = d - 1);
    if (d < 2) tb.slice(-4).forEach(c => c.novaDiv = d + 1);
  }
  S.clubes.forEach(c => { if (c.novaDiv !== undefined) { c.div = c.novaDiv; delete c.novaDiv; } });
  invalidarTabelas();
}
function noticia(t, tipo, clubeId) {
  S.news.unshift({ a: S.temporada, r: S.rodada, t: t, tipo: tipo || 'x', c: clubeId === undefined ? null : clubeId });
  if (S.news.length > 80) S.news.pop();
}

/* =========================================================
   FINANCAS - tudo calculado por clube (k)
   ========================================================= */
function fatorPos(pos, total) { return clamp(1 - (pos - 1) / Math.max(1, total - 1), 0, 1); }
function fatorForcaLiga(c) { return clamp((c.nivel - refLiga(c.div) + 10) / 20, 0, 1.4); }
function tvAnual(k) {
  const c = C(k), tot = S.clubes.filter(x => x.div === c.div).length;
  const fp = fatorPos(k.posRef || posDe(c), tot);
  return Math.round(ECO.TVBASE * Math.pow(fatorLiga(c.div), 2.4) * (0.35 + 0.35 * fp + 0.5 * fatorForcaLiga(c)) / 1e5) * 1e5;
}
function forcaRelativa(c) { return Math.pow(clamp((c.nivel - 40) / 32, 0.12, 2.2), 1.9); }
function socios(k) {
  const c = C(k);
  return Math.max(120, Math.round(ECO.SOCIO_BASE * Math.pow(fatorLiga(c.div), 1.5) * forcaRelativa(c)
    * (0.55 + k.aprovacao / 130) * (1 + 0.05 * (k.titulos || 0))));
}
function receitaSocios(k) { return socios(k) * ECO.MENSALIDADE * 12; }
function patrocinioAnual(k) {
  if (k.patrocinio) return k.patrocinio.valor;
  const c = C(k);
  return Math.round(ECO.PATRO * Math.pow(fatorLiga(c.div), 2.2) * forcaRelativa(c) / 1e5) * 1e5;
}
function ofertaPatrocinio(k) {
  const c = C(k), tot = S.clubes.filter(x => x.div === c.div).length;
  const fp = fatorPos(posDe(c), tot);
  return Math.round(ECO.PATRO * Math.pow(fatorLiga(c.div), 2.2) * forcaRelativa(c)
    * (0.75 + 0.5 * fp) * (0.85 + k.aprovacao / 400) / 1e5) * 1e5;
}
function capacidade(k) { return ECO.CAP[k.estadio.nivel]; }
function ingressoRef(k) { return Math.max(6, Math.round(ECO.INGRESSO_REF * Math.pow(fatorLiga(divDe(k)), 1.8) * 1.4)); }
function ocupacao(k, adv) {
  const c = C(k);
  const pen = clamp((k.estadio.preco / ingressoRef(k) - 1) * 0.30, -0.14, 0.55);
  const pos = 1 - (posDe(c) - 1) / Math.max(1, S.clubes.filter(x => x.div === c.div).length - 1);
  const grande = adv !== undefined && adv !== null ? clamp((S.clubes[adv].nivel - c.nivel + 12) / 60, 0, 0.22) : 0.08;
  const forma = clamp((k.aprovacao - 50) / 160, -0.22, 0.30);
  return clamp(0.34 + forma + pos * 0.26 + grande - pen, 0.06, 1);
}
function bilheteria(k, adv) {
  const pub = Math.round(capacidade(k) * ocupacao(k, adv));
  return { pub: pub, valor: Math.round(pub * k.estadio.preco) };
}
function manutEstadio(k) { return Math.round(capacidade(k) * ECO.MANUT_LUGAR); }
function manutDeptos(k) {
  let t = 0;
  ['ct', 'base', 'medico', 'scout'].forEach(x => { for (let n = 0; n < k[x]; n++) t += ECO.DEPTO[x][n] * ECO.DEPTO_MANUT; });
  return Math.round(t);
}
function despesaAnual(k) { return folhaAnual(k) + manutEstadio(k) + manutDeptos(k); }
function receitaAnualEstimada(k) {
  const casa = Math.floor(rodadasDe(k) / 2);
  return tvAnual(k) + receitaSocios(k) + patrocinioAnual(k) + bilheteria(k, null).valor * casa;
}
function premiacao(pos, div) {
  const mult = pos === 1 ? 1 : pos <= 4 ? 0.6 : pos <= 8 ? 0.35 : pos <= 12 ? 0.18 : 0.08;
  return Math.round(ECO.PREMIO * Math.pow(fatorLiga(div), 2.4) * mult / 1e5) * 1e5;
}
function anoZero() { return { tv: 0, bil: 0, soc: 0, pat: 0, pre: 0, ven: 0, out: 0, fol: 0, com: 0, man: 0, tra: 0, obr: 0, des: 0 }; }
function registrarAno(k, v, tipo) {
  const a = k.ano;
  if (v >= 0) {
    if (tipo === 'tv') a.tv += v; else if (tipo === 'bil') a.bil += v;
    else if (tipo === 'soc') a.soc += v; else if (tipo === 'pat') a.pat += v;
    else if (tipo === 'pre') a.pre += v; else if (tipo === 'ven') a.ven += v;
    else a.out += v;
  } else {
    if (tipo === 'fol') a.fol -= v; else if (tipo === 'com') a.com -= v;
    else if (tipo === 'man') a.man -= v; else if (tipo === 'tra') a.tra -= v;
    else if (tipo === 'obr') a.obr -= v; else a.des -= v;
  }
}
function caixaMovimento(k, v, txt, tipo) {
  k.caixa += v;
  k.livro.push({ r: S.rodada, t: txt, v: v });
  if (k.livro.length > 160) k.livro.splice(0, k.livro.length - 160);
  if (k.caixa < 0) {
    const falta = -k.caixa;
    k.divida += falta;
    k.caixa = 0;
    k.livro.push({ r: S.rodada, t: 'Emprestimo automatico', v: falta });
  }
  registrarAno(k, v, tipo);
}
function tetoCredito(k) { return Math.max(0, Math.round(receitaAnualEstimada(k) * ECO.TETO_DIVIDA) - k.divida); }
function podePagar(k, v) { return k.caixa + tetoCredito(k) >= v; }

function financasDaRodada(k, emCasa, adv) {
  const R = Math.max(1, rodadasDe(k));
  caixaMovimento(k, Math.round(tvAnual(k) / R), 'Cota de TV', 'tv');
  caixaMovimento(k, Math.round(receitaSocios(k) / R), 'Socio-torcedor', 'soc');
  caixaMovimento(k, Math.round(patrocinioAnual(k) / R), 'Patrocinio', 'pat');
  if (emCasa) {
    const b = bilheteria(k, adv);
    caixaMovimento(k, b.valor, 'Bilheteria (' + mil(b.pub) + ')', 'bil');
    k.publicoTotal += b.pub; k.jogosCasa++;
  }
  caixaMovimento(k, -Math.round(folhaAnual(k) / R), 'Folha salarial', 'fol');
  caixaMovimento(k, -Math.round((manutEstadio(k) + manutDeptos(k)) / R), 'Manutencao', 'man');
}

/* ---------------- torcida ---------------- */
function moverAprovacao(k, v) { k.aprovacao = clamp(k.aprovacao + v, 0, 100); }
function humorTorcida(k) {
  const a = k.aprovacao;
  return a >= 80 ? ['Euforia', 'ok'] : a >= 60 ? ['Confianca', 'ok'] : a >= 40 ? ['Paciencia curta', 'al'] : a >= 20 ? ['Revolta', 'er'] : ['Panelaco', 'er'];
}
function metaDaTemporada(k) {
  const c = C(k), tot = S.clubes.filter(x => x.div === c.div).length;
  const ranking = tabelaDiv(c.div).slice().sort((a, b) => b.nivel - a.nivel).findIndex(x => x.id === c.id) + 1;
  return clamp(Math.round(ranking * 0.9), 1, tot - 3);
}

/* ---------------- obras ---------------- */
function rotuloObra(t) {
  return t === 'estadio' ? 'Estadio' : t === 'ct' ? 'Centro de treinamento' : t === 'base' ? 'Categorias de base'
    : t === 'medico' ? 'Departamento medico' : 'Scouting';
}
function obraEmAndamento(k, tipo) { return k.obras.filter(o => o.tipo === tipo)[0] || null; }
function iniciarObra(k, tipo, alvo, custo, anos) {
  k.obras.push({ tipo: tipo, alvo: alvo, restante: anos, custo: custo });
  caixaMovimento(k, -custo, 'Obra: ' + rotuloObra(tipo), 'obr');
}
function avancarObras(k) {
  const prontas = [];
  k.obras.forEach(o => o.restante--);
  k.obras.filter(o => o.restante <= 0).forEach(o => {
    if (o.tipo === 'estadio') k.estadio.nivel = o.alvo; else k[o.tipo] = o.alvo;
    prontas.push(rotuloObra(o.tipo) + ' concluido no nivel ' + o.alvo);
  });
  k.obras = k.obras.filter(o => o.restante > 0);
  return prontas;
}

/* ---------------- valor e consolidado ---------------- */
function precoClube(c) { return Math.round(Math.pow(Math.max(c.nivel - 35, 6), 3) * ECO.PRECOCLUBE / 1e6) * 1e6; }
function valorClube(k) {
  const c = C(k);
  let extras = ECO.OBRA_ESTADIO.slice(1, k.estadio.nivel + 1).reduce((t, v) => t + (v || 0), 0) * 0.7;
  ['ct', 'base', 'medico', 'scout'].forEach(x => { for (let n = 0; n < k[x]; n++) extras += ECO.DEPTO[x][n] * 0.7; });
  const elenco = k.elenco.reduce((t, j) => t + valorDe(j), 0) * 0.5;
  return Math.round(precoClube(c) + extras + elenco + k.caixa - k.divida);
}
function consolidado() {
  const r = { caixa: 0, divida: 0, valor: 0, folha: 0, receita: 0, despesa: 0, elenco: 0, titulos: 0, aporte: 0, retirada: 0, recAno: 0, desAno: 0 };
  S.grupo.forEach(k => {
    const a = k.ano;
    r.caixa += k.caixa; r.divida += k.divida; r.valor += valorClube(k);
    r.folha += folhaAnual(k); r.receita += receitaAnualEstimada(k); r.despesa += despesaAnual(k);
    r.elenco += k.elenco.length; r.titulos += k.titulos;
    r.aporte += k.aporte; r.retirada += k.retirada;
    r.recAno += a.tv + a.bil + a.soc + a.pat + a.pre + a.ven + a.out;
    r.desAno += a.fol + a.com + a.man + a.tra + a.obr + a.des;
  });
  r.patrimonioTotal = r.valor + S.patrimonio;
  r.liquido = r.valor + r.retirada - r.aporte;
  return r;
}

/* =========================================================
   MESA DE DECISOES
   O dono nao caca jogador. A diretoria de cada clube traz
   propostas e o dono aprova, recusa ou delega.
   ========================================================= */
let SEQP = 1;
function prestigioClube(c) { return LIGAS[c.div].rep * 0.6 + c.nivel * 0.4; }
function ruido(k) { return Math.max(0, 4 - (k.scout || 0) - (k.diretor ? k.diretor.nivel - 1 : 0)); }
function estimar(k, j) {
  const e = ruido(k);
  return {
    ovr: clamp(j.ovr + ri(-e, e), 30, 97),
    potMin: clamp(j.pot - ri(0, e * 2), 30, 97),
    potMax: clamp(j.pot + ri(0, e * 2), 30, 97)
  };
}
function carenciaDe(k) {
  const falta = {};
  POSICOES.forEach(p => { falta[p] = ELENCO_ALVO[p] - k.elenco.filter(j => j.pos === p).length; });
  const e = escalacao(k.elenco);
  e.xi.forEach(x => { if (afinidade(x.j.pos, x.vaga) < 1) falta[x.vaga] = (falta[x.vaga] || 0) + 1; });
  const ordem = POSICOES.slice().sort((a, b) => falta[b] - falta[a]);
  return { falta: falta, prioridade: ordem[0], lista: ordem };
}
function alvoDeReforco(k) {
  const c = C(k), pol = k.politica, car = carenciaDe(k);
  const pos = Math.random() < 0.6 ? car.prioridade : pick(POSICOES);
  const ambicao = pol.ambicao === 'agr' ? 6 : pol.ambicao === 'aus' ? -3 : 2;
  let idade, ovr;
  const foco = pol.foco === 'mis' ? (Math.random() < 0.5 ? 'base' : 'pro') : pol.foco;
  if (foco === 'base') { idade = ri(17, 22); ovr = c.nivel - ri(4, 14) + ambicao * 0.5; }
  else { idade = ri(23, 31); ovr = c.nivel + ri(-3, 5) + ambicao; }
  const j = novoJogador(pos, Math.round(clamp(ovr, 32, 95)), idade, c.div, LIGAS[c.div].cont);
  if (foco === 'base') j.pot = clamp(j.pot + ri(2, 8), 40, 97);
  const origem = pick(S.clubes.filter(x => !ehMeu(x.id) && Math.abs(x.nivel - j.ovr) <= 14)) || null;
  const desconto = k.diretor ? 1 - k.diretor.nivel * 0.04 : 1;
  const valor = Math.round(valorDe(j) * ECO.MARGEM_VENDA * desconto * (0.9 + Math.random() * 0.35) / 10000) * 10000;
  const sal = Math.round(salarioDe(j.ovr, c.div) * (1 + clamp((j.ovr - c.nivel) * 0.02, -0.1, 0.45)) / 1000) * 1000;
  return { j: j, origem: origem ? origem.id : null, valor: valor, sal: sal, pos: pos };
}
function parecerReforco(k, alvo) {
  const c = C(k);
  const ganho = alvo.j.ovr - c.nivel;
  const pesoFolha = alvo.sal / Math.max(1, folhaAnual(k));
  const cabe = podePagar(k, alvo.valor);
  if (!cabe) return ['nao', 'Nao cabe no caixa nem no credito.'];
  if (pesoFolha > 0.22) return ['talvez', 'Salario pesado: ' + Math.round(pesoFolha * 100) + '% da folha atual.'];
  if (ganho >= 3) return ['sim', 'Entra como titular imediato.'];
  if (alvo.j.pot - alvo.j.ovr >= 10) return ['sim', 'Aposta de revenda: teto bem acima do atual.'];
  if (ganho >= 0) return ['talvez', 'Reforca sem mudar o patamar.'];
  return ['nao', 'Nao melhora o time de hoje.'];
}
function novaProposta(k, tipo, titulo, linha, custo, dados, recomenda, parecer) {
  return { id: SEQP++, clube: k.id, tipo: tipo, titulo: titulo, linha: linha, custo: custo || 0, dados: dados || {}, rec: recomenda, parecer: parecer };
}
function gerarMesaClube(k) {
  const c = C(k), pol = k.politica;
  k.propostas = [];
  const dir = k.diretor ? k.diretor.nivel : 0;

  /* reforcos */
  let nRef = 1 + dir + (pol.ambicao === 'agr' ? 1 : pol.ambicao === 'aus' ? -1 : 0);
  if (k.elenco.length >= 28) nRef = Math.min(nRef, 1);
  for (let i = 0; i < Math.max(0, nRef); i++) {
    const a = alvoDeReforco(k);
    const est = estimar(k, a.j);
    const p = parecerReforco(k, a);
    k.propostas.push(novaProposta(k, 'reforco',
      'Contratar ' + a.j.nome,
      a.pos + ' · ' + a.j.idade + ' anos · ' + (a.origem !== null ? S.clubes[a.origem].nome : 'sem clube'),
      a.valor, { alvo: a, est: est }, p[0], p[1]));
  }

  /* propostas recebidas por jogadores nossos */
  const cobicados = k.elenco.slice().sort((a, b) => valorDe(b) - valorDe(a)).slice(0, 8);
  cobicados.forEach(j => {
    const chance = clamp(0.08 + (j.ovr - c.nivel) * 0.05 + (j.pot - j.ovr >= 8 ? 0.10 : 0) + (pol.ambicao === 'aus' ? 0.08 : 0), 0.04, 0.55);
    if (Math.random() > chance) return;
    const comp = S.clubes.filter(x => !ehMeu(x.id) && x.nivel >= j.ovr - 6 && x.nivel <= j.ovr + 14);
    if (!comp.length) return;
    const cl = pick(comp);
    const mult = 0.85 + Math.random() * 0.8 + (k.diretor ? k.diretor.nivel * 0.05 : 0);
    const valor = Math.round(valorDe(j) * mult / 10000) * 10000;
    const bom = valor > valorDe(j) * 1.15;
    const titular = escalacao(k.elenco).xi.some(x => x.j.id === j.id);
    k.propostas.push(novaProposta(k, 'venda',
      'Vender ' + j.nome,
      'Proposta do ' + cl.nome + ' · ' + j.pos + ' · ' + j.ovr + ' de geral',
      -valor, { jid: j.id, clube: cl.id, valor: valor },
      bom && !titular ? 'sim' : bom ? 'talvez' : 'nao',
      bom ? 'Acima do valor de mercado.' : titular ? 'E titular. Sai o time, entra o dinheiro.' : 'Abaixo do que ele vale.'));
  });

  /* renovacoes - so o que a diretoria considera relevante */
  const xi = escalacao(k.elenco).xi;
  const vencendo = k.elenco.filter(j => j.contrato <= 1)
    .filter(j => xi.some(x => x.j.id === j.id) || (j.idade <= 23 && j.pot - j.ovr >= 6) || j.ovr >= c.nivel)
    .sort((a, b) => valorDe(b) - valorDe(a)).slice(0, 3);
  vencendo.forEach(j => {
    const novo = custoRenovacao(k, j);
    const vale = j.ovr >= c.nivel - 3 && j.idade <= 32;
    k.propostas.push(novaProposta(k, 'renovacao',
      'Renovar ' + j.nome,
      j.pos + ' · ' + j.idade + ' anos · contrato acaba em ' + j.contrato + ' temporada(s)',
      0, { jid: j.id, sal: novo },
      vale ? 'sim' : 'nao',
      vale ? 'Peca importante. Sai de graca se nao renovar.' : 'Pede ' + moeda(novo) + '/ano e ja passou do pico.'));
  });

  /* transferencia interna do grupo */
  if (S.grupo.length >= 2) propostaInterna(k);

  /* obra sugerida */
  if (!k.obras.length && Math.random() < 0.55) {
    const cand = [];
    if (k.estadio.nivel < 4 && ocupacao(k, null) > 0.8) cand.push(['estadio', k.estadio.nivel + 1, ECO.OBRA_ESTADIO[k.estadio.nivel + 1], ECO.OBRA_ANOS[k.estadio.nivel + 1], 'Estadio lotando. Ampliar vira receita.']);
    if (k.base < 3) cand.push(['base', k.base + 1, ECO.DEPTO.base[k.base], 1, 'Base melhor gera cria para vender.']);
    if (k.ct < 3) cand.push(['ct', k.ct + 1, ECO.DEPTO.ct[k.ct], 1, 'CT acelera a evolucao do elenco.']);
    if (k.medico < 3) cand.push(['medico', k.medico + 1, ECO.DEPTO.medico[k.medico], 1, 'Menos lesao ao longo do ano.']);
    if (k.scout < 3) cand.push(['scout', k.scout + 1, ECO.DEPTO.scout[k.scout], 1, 'Avaliacao mais precisa dos alvos.']);
    if (cand.length) {
      const o = pick(cand);
      k.propostas.push(novaProposta(k, 'obra', rotuloObra(o[0]) + ' nivel ' + o[1],
        o[3] + ' temporada(s) de obra', o[2], { tipo: o[0], alvo: o[1], anos: o[3] },
        podePagar(k, o[2]) ? 'talvez' : 'nao', o[4]));
    }
  }

  /* dispensa de peso morto */
  const pesoMorto = k.elenco.filter(j => j.idade >= 32 && j.sal > folhaAnual(k) * 0.07 && j.ovr < c.nivel - 4);
  if (pesoMorto.length && k.elenco.length > 19) {
    const j = pesoMorto[0];
    const multa = Math.round(j.sal * Math.max(0, j.contrato) * 0.5);
    k.propostas.push(novaProposta(k, 'dispensa', 'Rescindir com ' + j.nome,
      j.idade + ' anos · ' + moeda(j.sal) + '/ano · geral ' + j.ovr, multa, { jid: j.id, multa: multa },
      'talvez', 'Libera ' + moeda(j.sal) + '/ano de folha, mas custa multa agora.'));
  }

  /* patrocinio */
  if (!k.patrocinio) {
    const v = Math.round(ofertaPatrocinio(k) * (0.85 + Math.random() * 0.5) / 1e5) * 1e5;
    const anos = ri(1, 3);
    k.propostas.push(novaProposta(k, 'patrocinio', 'Patrocinio master: ' + pick(MARCAS),
      anos + ' temporada(s) · ' + moeda(v) + '/ano', 0, { valor: v, anos: anos, nome: pick(MARCAS) },
      'sim', 'Receita fixa sem contrapartida esportiva.'));
  }

  else if (S.rodada === Math.floor(maxRodadas() / 2)) {

}
function pularParaFim() { let g = 0; while (S.fase === 'liga' && g++ < 60) avancarRodada(); }
function fimDeTemporada() {
  completarLigas();
  S.grupo.forEach(k => { if (!k.fim) encerrarClube(k); });
  const r = { ano: S.temporada, receita: 0, despesa: 0, saldo: 0, titulos: 0, clubes: [] };
  S.grupo.forEach(k => {
    const s = k.relatorio;
    r.receita += s.receita; r.despesa += s.despesa; r.saldo += s.saldo;
    if (s.souCampeao) r.titulos++;
    r.clubes.push({ id: k.id, nome: C(k).nome, div: s.divNome, pos: s.pos, saldo: s.saldo, campeao: s.souCampeao, nivel: s.nivel, valor: s.valor });
  });
  const con = consolidado();

function comecarTemporada() {

  S.fase = 'liga';

/* ---------------- virada ---------------- */
function evoluirJogador(k, j) {
  const min = j.j;
  const treino = k.ct * 1.1 + (k.tecnico && k.tecnico.perfil === 'for' ? 2.2 : 0) + (k.tecnico ? k.tecnico.nivel * 0.5 : 0);
  let d = 0;
  if (j.idade <= 21) d = ri(1, 3) + Math.round(treino * 0.5) + (min >= 12 ? 1 : 0);
  else if (j.idade <= 25) d = ri(0, 2) + Math.round(treino * 0.3) + (min >= 18 ? 1 : 0);
  else if (j.idade <= 29) d = ri(-1, 1) + (min >= 20 ? 1 : 0);
  else if (j.idade <= 32) d = -ri(0, 2);
  else d = -ri(1, 4);
  if (j.ovr + d > j.pot) d = Math.max(0, j.pot - j.ovr);
  j.ovr = clamp(j.ovr + d, 30, 97);
  j.idade++; j.contrato--; j.lesao = 0;
  j.forma = ri(62, 88);
  j.moral = clamp(j.moral + (min >= 15 ? 4 : -6), 0, 100);
  j.j = 0; j.g = 0; j.a = 0; j.nota = 0;
}
function promoverBase(k) {
  if (!k.base) return [];
  const n = ri(1, k.base + 1), c = C(k), saidas = [];
  for (let x = 0; x < n; x++) {
    if (k.elenco.length >= 30) break;
    const ovr = clamp(Math.round(c.nivel - ri(10, 20) + k.base * 2 + k.ct * 1.5), 32, 78);
    const j = novoJogador(pick(POSICOES), ovr, ri(17, 19), c.div, LIGAS[c.div].cont);
    j.pot = clamp(j.pot + k.base * 3 + (k.tecnico && k.tecnico.perfil === 'for' ? 5 : 0), 40, 97);
    j.contrato = ri(3, 5);
    j.sal = Math.round(salarioDe(j.ovr, c.div) * 0.55 / 1000) * 1000;
    j.cria = true;
    k.elenco.push(j);
    saidas.push(j);
  }
  return saidas;
}
function completarElencoMinimo(k) {
  const c = C(k), novos = [];
  const falta = p => ELENCO_ALVO[p] - k.elenco.filter(j => j.pos === p).length;
  let g = 0;
  while ((k.elenco.length < 18 || POSICOES.some(p => falta(p) > 0)) && g++ < 24) {
    const p = POSICOES.slice().sort((a, b) => falta(b) - falta(a))[0];
    if (falta(p) <= 0 && k.elenco.length >= 18) break;
    const j = novoJogador(p, clamp(Math.round(c.nivel - ri(8, 16)), 32, 78), ri(18, 24), c.div, LIGAS[c.div].cont);
    j.contrato = ri(2, 4);
    j.sal = Math.round(salarioDe(j.ovr, c.div) * 0.7 / 1000) * 1000;
    j.cria = true;
    k.elenco.push(j);
    novos.push(j);
  }
  return novos;
}
function fairPlay(k) {
  const avisos = [], teto = receitaAnualEstimada(k);
  let g = 0;
  while (k.divida > teto && k.elenco.length > 18 && g++ < 6) {
    const alvo = k.elenco.slice().sort((a, b) => valorDe(b) - valorDe(a))[0];
    if (!alvo) break;
    const v = Math.round(valorDe(alvo) * 0.85);
    k.elenco = k.elenco.filter(x => x.id !== alvo.id);
    k.divida = Math.max(0, k.divida - v);
    avisos.push('Venda forcada no ' + C(k).nome + ': ' + alvo.nome + ' saiu por ' + moeda(v) + '.');
    moverAprovacao(k, -8);
  }
  return avisos;
}
function driftClubes() {
  S.clubes.forEach(c => {
    c.st = { j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, pts: 0 };
    if (ehMeu(c.id)) return;
    const alvo = Math.round((refLiga(c.div) + c.base) / 2);
    c.nivel = clamp(Math.round(c.nivel + (alvo - c.nivel) * 0.35) + ri(-2, 2), 38, 94);
  });
  invalidarTabelas();
}
function novaTemporada() {
  const antes = {};
  S.grupo.forEach(k => antes[k.id] = divDe(k));
  subirDescer();
  S.grupo.forEach(k => {
    const dep = divDe(k);
    if (dep < antes[k.id]) { noticia('ACESSO: ' + C(k).nome + ' sobe para a ' + DIVS[dep] + '.', 'titulo', k.id); moverAprovacao(k, 14); }
    if (dep > antes[k.id]) { noticia('Rebaixamento: ' + C(k).nome + ' cai para a ' + DIVS[dep] + '.', 'ruim', k.id); moverAprovacao(k, -22); }
  });
  S.temporada++;
  S.rodada = 0;
  S.grupo.forEach(k => {
    k.elenco = k.elenco.filter(j => {
      if (j.idade >= 38 || (j.idade >= 35 && j.ovr < 62)) { noticia(j.nome + ' se aposentou no ' + C(k).nome + '.', 'mercado', k.id); return false; }
      if (j.contrato <= 0) { noticia(j.nome + ' saiu de graca do ' + C(k).nome + '.', 'ruim', k.id); return false; }
      return true;
    });
    k.elenco.forEach(j => evoluirJogador(k, j));
    promoverBase(k).forEach(j => noticia('Da base do ' + C(k).nome + ': ' + j.nome + ' (' + j.pos + ', potencial ' + j.pot + ').', 'clube', k.id));
    fairPlay(k).forEach(t => noticia(t, 'ruim', k.id));
    const emerg = completarElencoMinimo(k);
    if (emerg.length) noticia(C(k).nome + ' inscreveu ' + emerg.length + ' jogador(es) de emergencia.', 'ruim', k.id);
    avancarObras(k).forEach(t => noticia(C(k).nome + ': ' + t, 'clube', k.id));
    if (k.tecnico) k.tecnico.sal = custoTecnico(k, k.tecnico.nivel);
    if (k.diretor) k.diretor.sal = custoDiretor(k, k.diretor.nivel);
    if (k.patrocinio) { k.patrocinio.anos--; if (k.patrocinio.anos <= 0) k.patrocinio = null; }
    k.ano = anoZero(); k.livro = []; k.publicoTotal = 0; k.jogosCasa = 0;
    k.posRef = 10; k.relatorio = null; k.fim = false; k.ultimaPartida = null;
  });
  driftClubes();
  S.grupo.forEach(k => { sincronizarForca(k); });
  gerarCalendarios();
  invalidarTabelas();
  S.grupo.forEach(k => { k.metaAtual = metaDaTemporada(k); });
  gerarMesa();
  S.relatorio = null;
  S.fase = 'pre';
  salvar();
}

/* ---------------- save ---------------- */
let SAVE_TIMER = null, SAVE_PEND = false;
function empacotar() {
  const c = {};
  for (const k in S) c[k] = S[k];
  c.cal = S.cal.map(l => l.map(r => r.map(g => g.pl ? [g.casa, g.fora, g.pl[0], g.pl[1]] : [g.casa, g.fora])));
  c.calC = 1; c.seq = SEQ; c.seqp = SEQP; c.ativo = ATIVO;
  return c;
}
function desempacotar(d) {
  if (d.calC && d.cal) {
    d.cal = d.cal.map(l => l.map(r => r.map(a =>
      Array.isArray(a) ? { casa: a[0], fora: a[1], pl: a.length > 2 ? [a[2], a[3]] : null } : a)));
    delete d.calC;
  }
  return d;
}
function gravar() {
  SAVE_PEND = false;
  if (SAVE_TIMER) { clearTimeout(SAVE_TIMER); SAVE_TIMER = null; }
  if (!S) return;
  try { DB.set(CHAVE, JSON.stringify(empacotar())); } catch (e) { }
}
function salvar() {
  if (!S) return;
  SAVE_PEND = true;
  if (SAVE_TIMER) return;
  SAVE_TIMER = setTimeout(function () { SAVE_TIMER = null; if (SAVE_PEND) gravar(); }, 600);
}
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && SAVE_PEND) gravar(); });
  if (typeof window !== 'undefined') window.addEventListener('pagehide', function () { if (SAVE_PEND) gravar(); });
}
function carregar() {
  const raw = DB.get(CHAVE);
  if (!raw) return false;
  try {
    const d = desempacotar(JSON.parse(raw));
    if (!d || !d.grupo || !d.grupo.length) return false;
    S = d;
    SEQ = d.seq || 1; SEQP = d.seqp || 1; ATIVO = clamp(d.ativo || 0, 0, S.grupo.length - 1);
    invalidarTabelas();
    return true;
  } catch (e) { return false; }
}
function apagar() {
  if (SAVE_TIMER) { clearTimeout(SAVE_TIMER); SAVE_TIMER = null; }
  SAVE_PEND = false;
  DB.del(CHAVE); S = null; TELA = 'grupo'; render();
}

    S.cal[c.div].forEach((rod, r) => {
      const g = rod.filter(x => x.casa === k.id || x.fora === k.id)[0];

function render() {
  const app = el('app');
  const chave = chaveTela();
  const manter = ULT_CHAVE === chave;
  const y = (typeof window !== 'undefined' && window.scrollY) || 0;
  desenhar(app);
  ULT_CHAVE = chave;
  if (manter && y && typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, y);
}
function desenhar(app) {
  if (!S) { app.innerHTML = TELA === 'criacao' ? telaCriacao() : telaInicio(); return; }
  if (S.fase === 'fim' && S.relatorio) { app.innerHTML = barra() + telaRelatorio(); return; }
  let corpo = '';
  if (TELA === 'mesa') corpo = telaMesa();
  else if (TELA === 'clube') corpo = telaClube();
  else if (TELA === 'liga') corpo = telaLiga();
  else if (TELA === 'fin') corpo = telaFin();
  else corpo = telaGrupo();
  app.innerHTML = barra() + corpo + nav();
}

/* ---------------- acoes ---------------- */
document.addEventListener('click', e => {
  const alvo = e.target.closest('[data-a]');
  if (!alvo) return;
  const partes = alvo.dataset.a.split(':');
  const a = partes[0], p1 = partes[1], p2 = partes[2];
  if (a === 'fechar-fundo' && e.target !== alvo) return;
  switch (a) {
    case 'novo': MUNDO = criarMundo(); UI.clube = null; UI.divSel = 2; UI.cap = 1; TELA = 'criacao'; render(); break;
    case 'voltar-inicio': TELA = 'inicio'; MUNDO = null; render(); break;
    case 'continuar': if (carregar()) { TELA = 'grupo'; render(); } else alerta('Sem jogo salvo', 'Nao encontrei um save neste aparelho.'); break;
    case 'cap': capturaNome(); UI.cap = Number(p1); render(); break;
    case 'divsel': capturaNome(); UI.divSel = Number(p1); if (!S) UI.clube = null; render(); break;
    case 'selclube': capturaNome(); UI.clube = Number(p1); render(); break;
    case 'comecar': {
      capturaNome();
      if (UI.clube === null) return;
      novoJogo(UI.cap, UI.clube, UI.nome.trim() || 'Grupo Imperio');
      TELA = 'grupo'; render(); break;
    }
    case 'tela': TELA = p1; fecharModal(); render(); break;
    case 'selk': ATIVO = Number(p1); TELA = 'clube'; UI.abaClube = 'visao'; render(); break;
    case 'comprando': UI.comprando = !UI.comprando; render(); break;
    case 'comprar': {
      const r = comprarClube(Number(p1));
      if (r) alerta('Compra', r);
      else { UI.comprando = false; ATIVO = S.grupo.length - 1; render(); }
      break;
    }
    case 'venderclube': {
      const k = K(), v = valorClube(k);
      abrirModal('<h3>Vender o ' + esc(C(k).nome) + '</h3>' +
        linha('Valor de venda', moeda(v)) + linha('Aportado', moeda(k.aporte)) + linha('Retirado', moeda(k.retirada)) +
        linha('Resultado', moeda(v + k.retirada - k.aporte), v + k.retirada - k.aporte >= 0 ? 'pos' : 'neg') +
        '<div style="height:12px"></div><button class="btn sec2" data-a="venderok">Vender mesmo assim</button>' +
        '<div style="height:7px"></div><button class="btn gh" data-a="fechar">Cancelar</button>');
      break;
    }
    case 'venderok': { const r = venderClube(ATIVO); fecharModal(); if (r) alerta('Venda', r); else { TELA = 'grupo'; render(); } break; }
    case 'comecar-temp': comecarTemporada(); render(); break;
    case 'retomar': retomarTemporada(); render(); break;
    case 'rodada': avancarRodada(); render(); break;
    case 'pular': pularParaFim(); render(); break;
    case 'nova-temp': novaTemporada(); TELA = 'grupo'; render(); break;
    case 'mesafiltro': UI.mesaFiltro = p1; render(); break;
    case 'prop': modalProposta(Number(p1)); break;
    case 'aprovar': {
      if (!janelaAberta()) { fecharModal(); alerta('Fora de janela', 'A diretoria so executa decisao de mercado na pre-temporada ou na janela do meio.'); break; }
      const r = aprovar(Number(p1));
      fecharModal();
      if (r) alerta('Nao rolou', r); else render();
      break;
    }
    case 'recusar': recusar(Number(p1)); fecharModal(); render(); break;
    case 'delegarj': {
      if (!janelaAberta()) { alerta('Fora de janela', 'Nada a executar agora.'); break; }
      const k = S.grupo[Number(p1)];
      const f = delegarClube(k);
      render();
      alerta('Diretoria resolveu', f.length ? f.length + ' decisao(oes) aprovada(s): ' + f.join('; ') : 'Nenhuma proposta recomendada cabia no caixa.');
      break;
    }
    case 'abaclube': UI.abaClube = p1; render(); break;
    case 'pambicao': K().politica.ambicao = p1; salvar(); render(); break;
    case 'pfoco': K().politica.foco = p1; salvar(); render(); break;
    case 'delegado': K().delegado = !K().delegado; salvar(); render(); break;
    case 'jogador': modalJogador(Number(p1)); break;
    case 'pedir': {
      const k = K();
      fecharModal();
      if (!janelaAberta()) { alerta('Fora de janela', 'A diretoria so mexe em contrato nas janelas.'); break; }
      const antes = k.propostas.length;
      gerarMesaClube(k);
      TELA = 'mesa'; UI.mesaFiltro = String(S.grupo.indexOf(k));
      render();
      alerta('Mesa atualizada', 'A diretoria refez a lista: ' + k.propostas.length + ' proposta(s) na mesa do ' + C(k).nome + '.');
      break;
    }
    case 'ingresso': {
      const k = K();
      k.estadio.preco = clamp(k.estadio.preco + Number(p1), 5, 900);
      moverAprovacao(k, Number(p1) > 0 ? -0.6 : 0.6);
      salvar(); render(); break;
    }
    case 'obra': {
      const k = K();
      if (obraEmAndamento(k, p1)) { alerta('Obra em andamento', 'Espere terminar antes de comecar outra.'); break; }
      let nv, custo, anos;
      if (p1 === 'estadio') { nv = k.estadio.nivel + 1; if (nv > 4) break; custo = ECO.OBRA_ESTADIO[nv]; anos = ECO.OBRA_ANOS[nv]; }
      else { nv = k[p1] + 1; if (nv > 3) break; custo = ECO.DEPTO[p1][nv - 1]; anos = 1; }
      if (!podePagar(k, custo)) { alerta('Sem dinheiro', 'Faltam ' + moeda(custo - k.caixa - tetoCredito(k)) + '.'); break; }
      iniciarObra(k, p1, nv, custo, anos);
      salvar(); render(); break;
    }
    case 'abafin': UI.abaFin = p1; render(); break;
    case 'aportar': { const r = aportar(Number(p1), Number(p2)); if (r) alerta('Aporte', r); else render(); break; }
    case 'retirar': { const r = retirar(Number(p1), Number(p2)); if (r) alerta('Retirada', r); else render(); break; }
    case 'moverde': UI.moverDe = Number(p1); render(); break;
    case 'moverpara': UI.moverPara = Number(p1); render(); break;
    case 'mover': {
      if (UI.moverDe === UI.moverPara) { alerta('Repasse', 'Escolha clubes diferentes.'); break; }
      const r = moverEntreClubes(UI.moverDe, UI.moverPara, Number(p1));
      if (r) alerta('Repasse', r); else render();
      break;
    }
    case 'abaliga': UI.abaLiga = p1; render(); break;
    case 'ligasel': UI.ligaSel = Number(p1); render(); break;
    case 'relclube': modalRelClube(Number(p1)); break;
    case 'apagar':
      abrirModal('<h3>Apagar tudo</h3><p class="mut" style="font-size:15px;line-height:1.45">Isso apaga o save deste aparelho e nao tem volta.</p>' +
        '<button class="btn sec2" data-a="apagar-ok">Apagar mesmo assim</button><div style="height:7px"></div><button class="btn gh" data-a="fechar">Cancelar</button>');
      break;
    case 'apagar-ok': fecharModal(); apagar(); break;
    case 'fechar': case 'fechar-fundo': fecharModal(); break;
  }
});

/* ---------------- boot ---------------- */
if (typeof document !== 'undefined' && el('app')) {
  if (carregar()) TELA = 'grupo';
  render();
}
</script>
</body>
</html>
