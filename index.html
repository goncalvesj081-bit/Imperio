<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<meta name="description" content="Fundo de Clubes - simulador de fundo de investimento em clubes de futebol.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fundo de Clubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E13; --bg2:#0D1319; --panel:#111820; --panel2:#161F29; --panel3:#1B2733;
  --line:#1E2A36; --line2:#2A3947; --txt:#E4EBF2; --muted:#75899C; --muted2:#55677A;
  --ac:#2FCB86; --ac2:#0F2B20; --gold:#DDB04A; --err:#E2564B; --info:#5C9FEA;
  --disp:'Archivo Black',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --data:'IBM Plex Mono',ui-monospace,monospace;
  --r:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--body);font-size:15px}
body{overscroll-behavior:none}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:78px}
.wrap{padding:12px 12px 20px}

/* ---------- cabecalho ---------- */
.hdr{position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--line2)}
.hdr .r1{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line)}
.hdr .brand{font-family:var(--disp);font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.hdr .ctx{font-family:var(--data);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.hdr .ctx b{color:var(--ac);font-weight:500}
.hdr .r2{padding:9px 12px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hdr .big{font-family:var(--data);font-size:25px;font-weight:600;line-height:1;color:var(--ac);letter-spacing:-.5px}
.hdr .cap{font-family:var(--data);font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted2);margin-top:4px}
.hdr .delta{font-family:var(--data);font-size:11px;text-align:right;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stats>div{padding:6px 9px;border-right:1px solid var(--line);min-width:0}
.stats>div:last-child{border-right:0}
.stats.c3{grid-template-columns:repeat(3,1fr)}
.stats.c2{grid-template-columns:repeat(2,1fr)}
.stats .dl{display:block;font-family:var(--data);font-size:9.5px;margin-top:2px;color:var(--muted2)}
.stats span{display:block;font-family:var(--data);font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted2)}
.stats b{display:block;font-family:var(--data);font-size:12.5px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- secoes e paineis ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:17px 2px 7px}
.sec:first-child{margin-top:2px}
.sec h4{margin:0;font-family:var(--data);font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.sec em{font-style:normal;font-family:var(--data);font-size:10px;color:var(--muted2);letter-spacing:.5px}
.panel{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);overflow:hidden}
.panel+.panel{margin-top:8px}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;background:var(--panel2);
  border-bottom:1px solid var(--line2);font-family:var(--data);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.panel>.hd b{color:var(--txt);font-weight:500}
.panel>.bd{padding:11px}
.panel>.bd.tight{padding:0}
.empty{padding:22px 14px;text-align:center;font-family:var(--data);font-size:11.5px;color:var(--muted2);letter-spacing:.4px}

h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.2px;text-transform:uppercase;margin:0}
h3{font-size:15px}
.mono{font-family:var(--data)}
.mut{color:var(--muted)}
.ok{color:var(--ac)} .neg{color:var(--err)} .gd{color:var(--gold)}
.msg{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0}
.msg b{color:var(--txt);font-weight:600}
.row{display:flex;align-items:center;gap:8px}

/* ---------- filtros ---------- */
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.filtros.f1{grid-template-columns:1fr}
.fld span{display:block;font-family:var(--data);font-size:8px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted2);margin-bottom:4px}
.fld .sw{position:relative}
.fld .sw:after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;margin-top:-4px;pointer-events:none;
  border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
select,input.txt{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  padding:9px 26px 9px 10px;font-family:var(--data);font-size:12.5px;color:var(--txt);outline:none;appearance:none;-webkit-appearance:none}
input.txt{padding:9px 10px;font-size:14px}
select:focus,input.txt:focus{border-color:var(--ac)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tg{font-family:var(--data);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;padding:6px 10px;
  border:1px solid var(--line2);border-radius:14px;color:var(--muted);background:var(--panel)}
.tg.on{border-color:var(--ac);color:var(--ac);background:var(--ac2)}

/* ---------- tabelas ---------- */
table.tbl{width:100%;border-collapse:collapse;font-family:var(--data);font-variant-numeric:tabular-nums}
.tbl th{font-size:8.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted2);font-weight:500;
  padding:7px 8px;text-align:right;background:var(--panel2);border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px;font-size:12.5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td:first-child{text-align:left;white-space:normal}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.eu td{background:rgba(47,203,134,.09)}
.tbl tr.cl:active td{background:var(--panel3)}
.tbl .nm{font-family:var(--body);font-size:13.5px;font-weight:500;display:block;line-height:1.25}
.tbl .sub{font-family:var(--data);font-size:9.5px;color:var(--muted2);letter-spacing:.3px;display:block;margin-top:2px}
.tbl .zn{display:inline-block;width:3px;height:13px;vertical-align:-2px;margin-right:6px;border-radius:2px;background:transparent}
.tbl .zn.s{background:var(--ac)} .tbl .zn.d{background:var(--err)}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}

/* ---------- linha de conta ---------- */
.ln{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line);font-family:var(--data);font-size:12.5px}
.ln:last-child{border-bottom:0}
.ln .lb{color:var(--muted);font-size:12px;flex:1;min-width:0;line-height:1.35}
.ln .lb i{display:block;font-style:normal;font-size:9.5px;color:var(--muted2);margin-top:2px}
.ln .vl{font-weight:600;white-space:nowrap}
.ln.tot{border-top:1px solid var(--line2);border-bottom:0;margin-top:3px;padding-top:9px;font-size:14px}
.ln.tot .lb{color:var(--txt);font-size:11px;text-transform:uppercase;letter-spacing:1.2px}

/* ---------- medidor ---------- */
.mtr{padding:9px 11px;border-bottom:1px solid var(--line)}
.mtr:last-child{border-bottom:0}
.mtr .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mtr .t b{font-family:var(--data);font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--txt)}
.mtr .t i{font-style:normal;font-family:var(--data);font-size:14px;font-weight:600}
.bar{position:relative;height:4px;background:var(--panel3);border-radius:2px;margin-top:7px;overflow:visible}
.bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.bar i.g{background:var(--gold)} .bar i.r{background:var(--err)}
.bar u{position:absolute;top:-3px;width:1px;height:10px;background:var(--muted);opacity:.85}
.mtr .ex{font-family:var(--data);font-size:9.5px;color:var(--muted2);margin-top:6px;line-height:1.45}

/* ---------- botoes ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--ac);color:#04140C;
  font-family:var(--data);font-weight:600;font-size:12px;letter-spacing:1.1px;text-transform:uppercase;
  padding:12px 12px;border-radius:var(--r);width:100%;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.sec2{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn.gh{background:var(--panel3);color:var(--txt);border:1px solid var(--line2)}
.btn.warn{background:var(--gold);color:#161005}
.btn.dgr{background:transparent;border:1px solid var(--err);color:var(--err)}
.btn[disabled]{opacity:.32;pointer-events:none}
.btn.sm{padding:9px 10px;font-size:11px}
.bt2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bt3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gap{height:8px}

/* ---------- segmentos ---------- */
.seg{display:flex;border-bottom:1px solid var(--line2);margin-bottom:11px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 13px;font-family:var(--data);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted2);border-bottom:2px solid transparent;white-space:nowrap}
.seg button.on{color:var(--ac);border-color:var(--ac)}

/* ---------- progresso ---------- */
.prg{height:3px;background:var(--panel3);border-radius:2px;overflow:hidden;margin:9px 0}
.prg i{display:block;height:100%;background:var(--ac)}

/* ---------- itens de lista ---------- */
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--panel3)}
.item .p{flex:1;min-width:0}
.item .p b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.item .p span{display:block;font-family:var(--data);font-size:10px;color:var(--muted2);letter-spacing:.3px;margin-top:3px;line-height:1.4}
.item .d{text-align:right;font-family:var(--data);font-size:12.5px;white-space:nowrap}
.item .d span{display:block;font-size:9px;color:var(--muted2);letter-spacing:.5px;margin-top:3px}
.tag{display:inline-block;font-family:var(--data);font-size:9px;font-weight:600;letter-spacing:.5px;padding:2px 5px;border-radius:2px;text-transform:uppercase}
.tag.v{background:var(--ac2);color:var(--ac)} .tag.a{background:#2C2410;color:var(--gold)}
.tag.r{background:#2C1512;color:#EE8880} .tag.n{background:var(--panel3);color:var(--muted2)}

/* ---------- radar ---------- */
.nt{display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.nt:last-child{border-bottom:0}
.nt i{font-style:normal;width:2px;border-radius:1px;background:var(--line2);flex:none}
.nt i.v{background:var(--ac)} .nt i.r{background:var(--err)} .nt i.a{background:var(--gold)}
.nt em{font-style:normal;font-family:var(--data);font-size:9.5px;color:var(--muted2);margin-right:6px}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:#070A0E;border-top:1px solid var(--line2);
  display:flex;max-width:560px;margin:0 auto;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2);
  font-family:var(--data);font-size:8.5px;letter-spacing:.9px;text-transform:uppercase;padding:3px 0}
.nav button.on{color:var(--ac)}
.nav svg{width:19px;height:19px}

/* ---------- modal ---------- */
.mod{position:fixed;inset:0;z-index:60;background:rgba(2,5,8,.85);display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:var(--bg2);border:1px solid var(--line2);border-radius:8px 8px 0 0;width:100%;max-width:560px;
  max-height:88vh;overflow:auto;padding:15px 13px calc(16px + env(safe-area-inset-bottom));animation:up .16s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- abertura ---------- */
.hero{padding:44px 16px 20px;text-align:center}
.hero h1{font-size:33px;line-height:.98;letter-spacing:.4px}
.hero h1 em{font-style:normal;color:var(--ac);display:block}
.hero p{color:var(--muted2);font-family:var(--data);letter-spacing:1.5px;text-transform:uppercase;font-size:9.5px;margin:12px 0 0}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   FUNDO DE CLUBES - simulador de fundo de investimento
   arquivo unico, sem dependencias, dados locais
   ========================================================= */

const el = id => document.getElementById(id);
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function moeda(n) {
  n = Math.round(n);
  const s = n < 0 ? '-' : '';
  const a = Math.abs(n);
  if (a >= 1e9) return s + 'R$ ' + (a / 1e9).toFixed(2).replace('.', ',') + ' bi';
  if (a >= 1e6) return s + 'R$ ' + (a / 1e6).toFixed(a >= 1e8 ? 0 : 1).replace('.', ',') + ' mi';
  if (a >= 1e3) return s + 'R$ ' + Math.round(a / 1e3) + ' mil';
  return s + 'R$ ' + a;
}
function sinal(n) { return (n >= 0 ? '+' : '') + moeda(n); }
function num(n) { return Math.round(n).toLocaleString('pt-BR'); }
function pct(n) { return Math.round(n * 100) + '%'; }
const DB = {
  mem: {},
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this.mem[k] = v; } },
  get(k) { try { const r = localStorage.getItem(k); return r === null ? (this.mem[k] || null) : r; } catch (e) { return this.mem[k] || null; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } delete this.mem[k]; }
};
const CHAVE = 'fundodeclubes_v1';

/* ---------------- icones ---------------- */
const I = {

  ligas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M7 6H4.5v1.5A3 3 0 007 10.4M17 6h2.5v1.5A3 3 0 0117 10.4"/><path d="M12 14v3M9 20h6"/></svg>',
  rel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
  seta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  volta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>',
  lupa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></svg>'
};
const ic = (n, s) => '<span style="display:inline-flex;width:' + (s || 15) + 'px;height:' + (s || 15) + 'px">' + I[n] + '</span>';

/* ---------------- dados do mundo ---------------- */
const CLUBES = [

  ['Cruzeiro', 'CRU', '#1C3F94', '#EFE9DA', 83, 0, 'MG'], ['Botafogo', 'BOT', '#101010', '#EFE9DA', 81, 0, 'RJ'],

  ['Sao Bernardo', 'SBE', '#E3B117', '#101010', 58, 1, 'SP'], ['Athletic', 'ATH', '#101010', '#E3B117', 57, 1, 'MG'],

function abrevDe(nome, usados) {
  const limpo = nome.normalize('NFD').replace(/[^A-Za-z ]/g, '');
  const p = limpo.split(' ').filter(w => w.length > 1 || /^[A-Z]$/.test(w));
  const cand = [];
  if (p[0]) cand.push(p[0].slice(0, 3));
  if (p.length >= 3) cand.push(p[0][0] + p[1][0] + p[2][0]);
  if (p.length >= 2) cand.push(p[0].slice(0, 2) + p[1][0]);
  if (p.length >= 2) cand.push(p[0][0] + p[1].slice(0, 2));
  if (p[1]) cand.push(p[1].slice(0, 3));
  if (p[0]) cand.push(p[0].slice(0, 2) + (p[0][3] || p[0][2] || 'X'));
  if (p[0]) cand.push(p[0].replace(/[aeiouAEIOU]/g, '').slice(0, 3));
  if (p[1]) cand.push(p[1].replace(/[aeiouAEIOU]/g, '').slice(0, 3));
  for (const c of cand) {
    const ab = c.toUpperCase();
    if (ab.length === 3 && !usados[ab]) { usados[ab] = 1; return ab; }
  }
  let base = (p[0] || 'CLU').slice(0, 2).toUpperCase(), k = 1, ab;
  do { ab = base + (k++); } while (usados[ab]);
  usados[ab] = 1;
  return ab;
}

function calendarioDiv(ids) {
  const n = ids.length, fixo = ids[0];
  let rot = ids.slice(1), turno = [];
  for (let r = 0; r < n - 1; r++) {
    const lista = [fixo].concat(rot), jogos = [];
    for (let i = 0; i < n / 2; i++) {
      const a = lista[i], b = lista[n - 1 - i];
      jogos.push((r + i) % 2 === 0 ? { casa: a, fora: b } : { casa: b, fora: a });
    }
    turno.push(jogos); rot.unshift(rot.pop());
  }
  for (let i = turno.length - 1; i > 0; i--) { const j = ri(0, i); const t = turno[i]; turno[i] = turno[j]; turno[j] = t; }
  return turno.concat(turno.map(rr => rr.map(j => ({ casa: j.fora, fora: j.casa }))))
    .map(rr => rr.map(j => ({ casa: j.casa, fora: j.fora, pl: null })));
}

  if (gA > gB) { A.st.v++; B.st.d++; A.st.pts += 3; }
  else if (gB > gA) { B.st.v++; A.st.d++; B.st.pts += 3; }

function folhaBase(p, c) {

  const refRec = REF.rec[c.div] || 1e6, refNiv = REF.niv[c.div] || 50;
  return refRec * 0.58 * Math.pow(c.nivel / refNiv, 3.2);
}
function despesaClube(p, c) {
  const fg = fatorGestao(p);
  const folha = folhaBase(p, c) * fg;
  const manutencao = folha * MANUT[p.manut].c;
  const comissao = folha * TECNICOS[p.tecnico || 0].c;
  const operacao = (1.5e6 + 9e6 * ECO[c.div] + p.capacidade * 90) * fg;
  const estadio = p.capacidade * 105 * (1.5 - p.conservacao / 100 * 0.7);
  const juros = p.divida * 0.11;
  const total = folha + manutencao + comissao + operacao + estadio + juros;
  return { folha: folha, manutencao: manutencao, comissao: comissao, operacao: operacao, estadio: estadio, juros: juros, total: total };
}
function valorMercado(p, c) {
  const forca = Math.pow(Math.max(c.nivel - 35, 3), 3) * 9000;
  const mLiga = 0.80 + ECO[c.div] * 0.38;
  const mMarca = 1 + p.marca / 100 * 0.55 + Math.min(0.25, p.socios / 200000);
  const mInfra = 1 + Math.min(0.45, p.capacidade / 150000) + p.estrutura / 100 * 0.20 + p.base / 100 * 0.28 + p.conservacao / 100 * 0.10;
  const rec = receitaBruta(p, c);
  const fSaude = clamp(1.12 - p.divida / Math.max(rec, 1) * 0.42, 0.42, 1.12);
  const fMom = 1 + clamp(p.momento, -0.25, 0.35);
  const bruto = forca * mLiga * mMarca * mInfra * fSaude * fMom;
  return {
    forca: forca, mLiga: mLiga, mMarca: mMarca, mInfra: mInfra, fSaude: fSaude, fMom: fMom,
    bruto: bruto, divida: p.divida, liquido: Math.max(bruto * 0.15, bruto - p.divida)

function precoAlvo(p, c) { return valorMercado(p, c).liquido * (1 + p.premio); }

  const rec = receitaBruta(p, c), des = despesaClube(p, c).total;
  return p.divida > rec * 1.1 || des > rec * 1.18 || p.moral < 38;
}

function aplicarAlavanca(a, id) {

function sincronizar(a) {

  invalidarTabelas();
}

/* pagamento: usa o caixa do clube primeiro, depois o caixa do fundo */
function pagar(a, custo) {
  const doClube = Math.min(a.caixa, custo), doFundo = custo - doClube;
  if (doFundo > S.f.caixa) return 'Falta ' + moeda(doFundo - S.f.caixa) + ' no caixa do fundo';
  a.caixa -= doClube;
  if (doFundo > 0) { S.f.caixa -= doFundo; a.aporte = (a.aporte || 0) + doFundo; }
  return null;
}

/* =========================================================
   FUNDO
   ========================================================= */
let S = null, MUNDO = null, TELA = 'fundo';

function novoFundo(nome, idClube) {
  S = {
    clubes: MUNDO, temporada: 1, rodada: 0, rodadas: 0, fase: 'pre',

}
function ativo(id) { return S.clubes[id].p; }
function meus() { return S.donos.map(id => S.clubes[id].p); }
function ehMeu(id) { return S.donos.indexOf(id) >= 0; }
function patrimonio() {
  let t = S.f.caixa - S.f.divida;

function limiteCredito() {

function tomarEmprestimo(v) {

}
function quitarDividaFundo(v) {

function aportar(a, v) {
  v = Math.round(Math.min(v, S.f.caixa));
  if (v <= 0) return 'Sem caixa no fundo';
  S.f.caixa -= v; a.caixa += v; a.aporte = (a.aporte || 0) + v;
  salvar(); return null;
}
function retirar(a, v) {
  v = Math.round(Math.min(v, a.caixa));
  if (v <= 0) return 'O clube nao tem caixa livre';
  a.caixa -= v; S.f.caixa += v; a.retirado = (a.retirado || 0) + v;
  salvar(); return null;
}
function quitarDividaClube(a, v) {
  const c = S.clubes[a.id];
  v = Math.round(Math.min(v, a.divida));
  if (v <= 0) return 'O clube nao tem divida';
  const err = pagar(a, v);
  if (err) return err;
  a.divida -= v; a.gasto = (a.gasto || 0) + v;
  noticia(c.nome + ': ' + moeda(v) + ' de divida quitados.', 'v');

}
function noticia(t, tipo) {

  if (S.noticias.length > 40) S.noticias.pop();
}
function balanco(a) {
  const c = S.clubes[a.id], v = valorMercado(a, c);
  const investido = a.compra.preco + (a.aporte || 0);
  const retorno = (a.retirado || 0) + valorVenda(a) + a.caixa;
  return { investido: investido, retorno: retorno, resultado: retorno - investido, valor: v.liquido };
}

/* =========================================================
   MERCADO DE CLUBES
   ========================================================= */
function acessoLiga(d) { return LIGAS[d].rep <= S.f.reputacao + 22; }
function temNaLiga(d) { return meus().some(a => S.clubes[a.id].div === d); }
function custoDD(id) {

}
function fazerDD(id) {
  if (S.dd[id]) return 'Relatorio ja feito';
  const v = custoDD(id);
  if (v > S.f.caixa) return 'Falta ' + moeda(v - S.f.caixa) + ' no caixa';
  S.f.caixa -= v; S.dd[id] = 1;

}
function ofertas(id) {
  const c = S.clubes[id], alvo = precoAlvo(c.p, c);
  return [
    { id: 'baixa', n: 'Oferta agressiva', v: Math.round(alvo * 0.82), risco: true },
    { id: 'justa', n: 'Preco pedido', v: Math.round(alvo), risco: false },
    { id: 'cheia', n: 'Fechar na hora', v: Math.round(alvo * 1.08), risco: false }
  ];
}
function chanceAceite(id) {
  const c = S.clubes[id], p = c.p;
  return clamp(0.16 + (emCrise(p, c) ? 0.34 : 0) + S.f.reputacao / 260 - p.premio * 0.9, 0.05, 0.86);
}
function comprarClube(id, tipoOferta, inicial) {
  const c = S.clubes[id], p = c.p;
  if (ehMeu(id)) return 'Esse clube ja e seu';
  if (!inicial && S.fase !== 'pre') return 'Compras so na pre-temporada';
  if (!inicial && !acessoLiga(c.div)) return 'A reputacao do fundo nao abre porta na ' + DIVS[c.div];
  if (!inicial && S.recusas[id] === S.temporada) return 'O dono recusou nesta temporada. Volte na proxima';
  const of = ofertas(id).filter(o => o.id === tipoOferta)[0];
  const preco = of.v;
  if (preco > S.f.caixa) return 'Falta ' + moeda(preco - S.f.caixa) + ' no caixa do fundo';
  if (of.risco && Math.random() > chanceAceite(id)) {
    S.recusas[id] = S.temporada;
    noticia('O dono do ' + c.nome + ' recusou a oferta de ' + moeda(preco) + '.', 'r');

  }
  const mesmaLiga = temNaLiga(c.div);

  }

  salvar();
  return null;
}
function valorVenda(a) {
  const c = S.clubes[a.id];

}
function venderClube(id) {
  if (!ehMeu(id)) return 'Esse clube nao e seu';
  if (S.fase !== 'pre') return 'Vendas so na pre-temporada';
  if (S.donos.length <= 1) return 'O fundo precisa de pelo menos um clube';
  const c = S.clubes[id], a = c.p, b = balanco(a);
  const v = valorVenda(a) + a.caixa;
  S.f.caixa += v;
  S.donos = S.donos.filter(x => x !== id);

    S.f.reputacao = clamp(S.f.reputacao - 5, 0, 100);
    noticia('Voce vendeu o ' + c.nome + ' pior do que comprou. O mercado anotou.', 'r');

    S.f.reputacao = clamp(S.f.reputacao + 3, 0, 100);
  }
  a.caixa = 0;
  delete a.compra; delete a.hist;
  noticia('Venda do ' + c.nome + ' por ' + moeda(v) + '. Resultado do projeto: ' + sinal(b.resultado) + '.', b.resultado >= 0 ? 'v' : 'r');
  salvar();
  return null;
}
function listaMercado(divSel) {
  const lista = [];
  S.clubes.forEach(c => {
    if (ehMeu(c.id)) return;
    if (divSel !== 'todas' && c.div !== divSel) return;
    if (!acessoLiga(c.div)) return;
    const preco = precoAlvo(c.p, c);
    if (divSel === 'todas' && preco > Math.max(S.f.caixa * 1.6, 30e6)) return;
    lista.push({ c: c, preco: preco });
  });
  lista.sort((a, b) => a.preco - b.preco);
  return lista.slice(0, 40);
}

/* =========================================================
   CICLO DE TEMPORADA
   ========================================================= */
function iniciarTemporada() {
  S.fase = 'temp';
  noticia('Temporada ' + S.temporada + ' comecou.', '');
  salvar();
}
function avancar(n) {
  for (let i = 0; i < n && S.rodada < S.rodadas; i++) simularRodada();
  if (S.rodada >= S.rodadas) encerrarTemporada();
  salvar();
}
function pularFim() { completarLigas(); encerrarTemporada(); salvar(); }

function refLiga(d) {
  const cl = S.clubes.filter(c => c.div === d);
  return cl.reduce((t, c) => t + c.base, 0) / Math.max(1, cl.length);
}
function encerrarTemporada() {
  completarLigas();
  const rel = { temporada: S.temporada, clubes: [], fundo: null };
  const patAntes = patrimonio(), caixaAntes = S.f.caixa, repAntes = S.f.reputacao;
  const fotos = {};
  /* 1. fotografar antes de qualquer movimento de divisao */
  S.donos.forEach(id => {
    const c = S.clubes[id];
    fotos[id] = { pos: posDoClube(c), div: c.div, campeao: posDoClube(c) === 1, nivel: c.nivel };
  });
  /* 2. resultado financeiro da temporada */
  S.donos.forEach(id => {
    const c = S.clubes[id], a = c.p, f = fotos[id];
    const rec = receitaClube(a, c, f.pos), des = despesaClube(a, c);
    const saldo = rec.total - des.total;
    const linha = {
      id: id, nome: c.nome, div: DIVS[f.div], pos: f.pos, campeao: f.campeao,
      rec: rec, des: des, saldo: saldo, nivelAntes: f.nivel,
      valorAntes: valorMercado(a, c).liquido, calote: 0, subiu: false, desceu: false
    };
    a.caixa += saldo;
    if (a.caixa < 0) {
      const falta = -a.caixa; a.caixa = 0;
      const doFundo = Math.min(S.f.caixa, falta);
      S.f.caixa -= doFundo; a.aporte = (a.aporte || 0) + doFundo;
      const resto = falta - doFundo;
      if (resto > 0) {
        a.divida += resto; linha.calote = resto;
        S.f.reputacao = clamp(S.f.reputacao - 3, 0, 100);
        noticia(c.nome + ' fechou no vermelho e rolou ' + moeda(resto) + ' para a divida.', 'r');
      }
    }
    rel.clubes.push(linha);
  });
  /* 3. acesso e rebaixamento */
  const mov = subirDescer();
  mov.forEach(m => {
    const linha = rel.clubes.filter(x => x.id === m[0])[0];
    if (!linha) return;
    if (m[2] < m[1]) linha.subiu = true; else linha.desceu = true;
    linha.divNova = DIVS[m[2]];
  });
  /* 4. evolucao dos ativos do fundo */
  S.donos.forEach(id => {
    const c = S.clubes[id], a = c.p, f = fotos[id];
    const linha = rel.clubes.filter(x => x.id === id)[0];
    a.obras.forEach(o => { o.r--; });
    a.obras.filter(o => o.r <= 0).forEach(o => concluirObra(a, o));
    a.obras = a.obras.filter(o => o.r > 0);
    a.elenco = clamp(a.elenco + MANUT[a.manut].q + a.base / 100 * 4 + a.estrutura / 100 * 1.2, 0, 100);
    sincronizar(a);
    a.conservacao = clamp(a.conservacao - 4, 5, 100);
    const e = ECO[c.div];
    const alvoSocios = a.marca * a.marca * 9 * (0.6 + e * 0.5) / 100 * (0.7 + a.moral / 250 + (f.pos <= 6 ? 0.18 : 0));
    a.socios = Math.round(a.socios + (alvoSocios - a.socios) * 0.32);
    let dm = f.campeao ? 16 : linha.subiu ? 14 : f.pos <= 4 ? 7 : linha.desceu ? -22 : f.pos <= 10 ? 1 : -6;
    dm -= clamp((a.ingresso / precoRef(c.div) - 1) * 12, -4, 10);
    a.moral = clamp(Math.round(a.moral + dm), 15, 98);
    a.momento = Math.round(1000 * clamp(a.momento * 0.6 + (f.campeao ? 0.18 : 0) + (linha.subiu ? 0.14 : 0) + (linha.desceu ? -0.22 : 0) + (f.pos <= 4 ? 0.05 : 0), -0.3, 0.4)) / 1000;
    if (f.campeao) { S.f.reputacao = clamp(S.f.reputacao + 8, 0, 100); noticia(c.nome + ' campeao da ' + DIVS[f.div] + '.', 'v'); }
    if (linha.subiu) { S.f.reputacao = clamp(S.f.reputacao + 6, 0, 100); noticia(c.nome + ' subiu para a ' + linha.divNova + '.', 'v'); }
    if (linha.desceu) { S.f.reputacao = clamp(S.f.reputacao - 8, 0, 100); noticia(c.nome + ' caiu para a ' + linha.divNova + '.', 'r'); }
    linha.valorDepois = valorMercado(a, c).liquido;
    linha.nivelDepois = c.nivel;
    a.hist = a.hist || [];
    a.hist.push({ t: S.temporada, div: DIVS[f.div], pos: f.pos, rec: Math.round(rec0(linha)), des: Math.round(linha.des.total), saldo: Math.round(linha.saldo), valor: Math.round(linha.valorDepois) });
    if (a.hist.length > 12) a.hist.shift();
  });
  /* 5. resto do mundo se ajusta */
  S.clubes.forEach(c => {
    if (ehMeu(c.id)) return;
    const alvo = (refLiga(c.div) + c.base) / 2;
    c.nivel = clamp(Math.round(c.nivel + clamp(alvo - c.nivel, -2, 2)), 38, 94);
    c.p.elenco = Math.round(elencoDe(c.nivel) * 10) / 10;
    c.p.momento = Math.round(c.p.momento * 500) / 1000;
  });
  /* 6. fundo */
  const juros = Math.round(S.f.divida * 0.11);
  if (juros > 0) {
    if (S.f.caixa >= juros) S.f.caixa -= juros;
    else { S.f.divida += juros - S.f.caixa; S.f.caixa = 0; S.f.reputacao = clamp(S.f.reputacao - 2, 0, 100); }
  }
  const pat = patrimonio();
  if (pat > (S.f.pico || 0)) { S.f.reputacao = clamp(S.f.reputacao + 2, 0, 100); S.f.pico = pat; }
  rel.fundo = {
    patrimonio: pat, caixa: S.f.caixa, divida: S.f.divida, juros: juros,
    reputacao: S.f.reputacao,
    patrimonioAntes: patAntes, caixaAntes: caixaAntes, reputacaoAntes: repAntes,
    receita: rel.clubes.reduce((t, x) => t + x.rec.total, 0),
    despesa: rel.clubes.reduce((t, x) => t + x.des.total, 0),
    saldo: rel.clubes.reduce((t, x) => t + x.saldo, 0)
  };
  S.f.hist.push({ t: S.temporada, pat: Math.round(pat), caixa: Math.round(S.f.caixa), divida: Math.round(S.f.divida), rep: S.f.reputacao, n: S.donos.length, saldo: Math.round(rel.fundo.saldo) });
  if (S.f.hist.length > 20) S.f.hist.shift();
  /* 7. virada */
  S.clubes.forEach(c => { c.st = { j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, pts: 0 }; });
  invalidarTabelas();
  S.temporada++;
  S.rodada = 0;
  S.recusas = {};
  REF = calcularRefs(S.clubes);
  gerarCalendarios();
  S.relatorio = rel;
  S.fase = 'relatorio';
}

let SAVE_PEND = false, SAVE_TIMER = null;
function empacotar() {
  const c = {};
  for (const k in S) c[k] = S[k];
  c.cal = S.cal.map(liga => liga.map(rod => rod.map(g => g.pl ? [g.casa, g.fora, g.pl[0], g.pl[1]] : [g.casa, g.fora])));
  c.calC = 1;
  return c;
}
function desempacotar(d) {
  if (d.calC && d.cal) {
    d.cal = d.cal.map(liga => liga.map(rod => rod.map(a =>
      Array.isArray(a) ? { casa: a[0], fora: a[1], pl: a.length > 2 ? [a[2], a[3]] : null } : a)));
    delete d.calC;
  }
  return d;
}
function gravar() {
  SAVE_PEND = false;
  if (SAVE_TIMER) { clearTimeout(SAVE_TIMER); SAVE_TIMER = null; }
  if (!S) return;
  try { DB.set(CHAVE, JSON.stringify(empacotar())); } catch (e) { }
}
function salvar() {
  if (!S) return;
  SAVE_PEND = true;
  if (SAVE_TIMER) return;
  SAVE_TIMER = setTimeout(function () { SAVE_TIMER = null; if (SAVE_PEND) gravar(); }, 600);
}
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && SAVE_PEND) gravar(); });
  if (typeof window !== 'undefined') window.addEventListener('pagehide', function () { if (SAVE_PEND) gravar(); });
}
function carregar() {
  const raw = DB.get(CHAVE);
  if (!raw) return false;
  try {
    const d = desempacotar(JSON.parse(raw));
    if (!d || !d.f || !d.donos) return false;
    S = d;
    if (!S.recusas) S.recusas = {};
    if (!S.dd) S.dd = {};
    invalidarTabelas();
    REF = calcularRefs(S.clubes);
    return true;
  } catch (e) { return false; }
}
function apagar() {
  if (SAVE_TIMER) { clearTimeout(SAVE_TIMER); SAVE_TIMER = null; }
  SAVE_PEND = false; DB.del(CHAVE); S = null; TELA = 'fundo'; render();
}

function filtrarMercado() {
  const faixas = { todas: Infinity, cx: S.f.caixa, m50: 50e6, m200: 200e6, b1: 1e9 };
  const teto = faixas[UI.mercFaixa] === undefined ? Infinity : faixas[UI.mercFaixa];
  const busca = UI.mercBusca.trim().toLowerCase();
  let lista = [];
  S.clubes.forEach(c => {
    if (ehMeu(c.id)) return;
    if (!acessoLiga(c.div)) return;
    if (UI.mercDiv !== 'alc' && c.div !== Number(UI.mercDiv)) return;
    const preco = precoAlvo(c.p, c);
    if (preco > teto) return;
    if (UI.mercDiv === 'alc' && preco > Math.max(S.f.caixa * 1.5, 30e6)) return;
    if (UI.mercCrise && !emCrise(c.p, c)) return;
    if (UI.mercDD && !S.dd[c.id]) return;
    if (busca && c.nome.toLowerCase().indexOf(busca) < 0) return;
    lista.push({ c: c, preco: preco });
  });
  lista.sort((a, b) =>
    UI.mercOrd === 'preco' ? a.preco - b.preco :
      UI.mercOrd === 'precod' ? b.preco - a.preco :
        UI.mercOrd === 'forca' ? b.c.nivel - a.c.nivel : b.c.p.marca - a.c.p.marca);
  return lista.slice(0, 50);
}

      .map(c => ({ c: c, r: receitaClube(c.p, c, 10).total, v: valorMercado(c.p, c).liquido }))
      .sort((a, b) => b.v - a.v)
      .map(x => '<tr class="' + (ehMeu(x.c.id) ? 'eu' : '') + '"><td><span class="nm">' + esc(x.c.nome) + '</span>' +
        '<span class="sub">forca ' + x.c.nivel + ' &middot; torcida ' + Math.round(x.c.p.marca) + '</span></td>' +
        '<td>' + moeda(x.r) + '</td><td>' + (S.dd[x.c.id] || ehMeu(x.c.id) ? moeda(x.c.p.divida) : '?') + '</td>' +
        '<td class="ok">' + moeda(x.v) + '</td></tr>');
    h += painel(DIVS[d], 'PADRAO DA LIGA',
      ln('Forca media', Math.round(REF.niv[d])) +
      ln('Receita mediana', moeda(REF.rec[d])) +
      ln('Publico medio pago', num(REF.cap[d]) + ' lugares') +
      ln('Perfil economico', NOME_ECO[d])) +
      '<div class="gap"></div>' + painel('', '', tabela(['Clube', 'Receita', 'Divida', 'Valor'], linhas), true);
  }
  return h + '</div>';
}

/* ---------------- tela: relatorios ---------------- */
function telaRel() {
  let h = '<div class="wrap">' + sec('evolucao do fundo');
  if (!S.f.hist.length) h += painel('', '', vazio('O primeiro relatorio sai no fim da temporada'), true);
  else {
    h += painel('', '', tabela(['Temp', 'Patrimonio', 'Caixa', 'Divida', 'Rep'],
      S.f.hist.slice().reverse().map(x => '<tr><td><span class="nm">T' + x.t + '</span><span class="sub">' + x.n + ' ativo' + (x.n === 1 ? '' : 's') + '</span></td>' +
        '<td>' + moeda(x.pat) + '</td><td>' + moeda(x.caixa) + '</td>' +
        '<td class="' + (x.divida > 0 ? 'neg' : 'mut') + '">' + moeda(x.divida) + '</td><td>' + Math.round(x.rep) + '</td></tr>')), true);
    const p0 = S.f.hist[0].pat, p1 = patrimonio();
    h += '<div class="gap"></div>' + painel('', '',
      ln('Patrimonio na temp ' + S.f.hist[0].t, moeda(p0)) +
      ln('Patrimonio hoje', moeda(p1), 'ok') +
      ln('Melhor marca ja atingida', moeda(S.f.pico || p1)) +
      lnTot('Variacao no periodo', (p1 >= p0 ? '+' : '') + Math.round((p1 / Math.max(1, p0) - 1) * 100) + '%', p1 >= p0 ? 'ok' : 'neg'));
  }
  const temps = [];
  S.noticias.forEach(n => { if (temps.indexOf(n.temp) < 0) temps.push(n.temp); });
  const nots = S.noticias.filter(n => UI.relFiltro === 'todas' || n.temp === Number(UI.relFiltro));
  h += sec('historico de eventos') +
    '<div class="filtros f1">' + campo('Temporada', selHTML('relf', UI.relFiltro, [['todas', 'Todas as temporadas']].concat(temps.map(t => [t, 'Temporada ' + t])))) + '</div>' +
    painel('', '', nots.length ? nots.map(n => '<div class="nt"><i class="' + n.tipo + '"></i><span><em>T' + n.temp + '</em>' + esc(n.t) + '</span></div>').join('') : vazio('Sem registros'), true);
  return h + '</div>';
}

/* ---------------- fechamento de temporada ---------------- */
function varTxt(n) { return Math.abs(n) < 1e5 ? 'estavel' : sinal(n); }
function celula(rotulo, valor, delta, cor) {
  return '<div><span>' + esc(rotulo) + '</span><b class="' + (cor || '') + '">' + valor + '</b>' +
    (delta ? '<span class="dl">' + delta + '</span>' : '') + '</div>';
}
function telaRelatorio() {
  const r = S.relatorio, f = r.fundo;
  const dPat = f.patrimonio - f.patrimonioAntes;
  const subiram = r.clubes.filter(x => x.subiu).length, cairam = r.clubes.filter(x => x.desceu).length;
  const titulos = r.clubes.filter(x => x.campeao).length;
  let manchete;
  if (titulos) manchete = 'Temporada de titulo. ';
  else if (subiram) manchete = 'Temporada de acesso. ';
  else if (cairam) manchete = 'Temporada de queda. ';
  else manchete = 'Temporada sem mudanca de divisao. ';
  manchete += dPat >= 0
    ? 'O fundo comecou o ano valendo ' + moeda(f.patrimonioAntes) + ' e terminou valendo ' + moeda(f.patrimonio) + '.'
    : 'O fundo perdeu ' + moeda(-dPat) + ' de valor: comecou o ano em ' + moeda(f.patrimonioAntes) + ' e fechou em ' + moeda(f.patrimonio) + '.';

  let h = '<div class="wrap">' +
    '<div class="panel"><div class="hd"><span>FECHAMENTO</span><b>TEMPORADA ' + r.temporada + '</b></div>' +
    '<div class="bd" style="padding:12px 12px 11px">' +
    '<div class="num ' + (dPat >= 0 ? 'ok' : 'neg') + '" style="font-size:26px;font-weight:600;line-height:1">' + sinal(dPat) + '</div>' +
    '<div class="cap" style="font-family:var(--data);font-size:8.5px;letter-spacing:1.6px;color:var(--muted2);margin-top:4px">VARIACAO DO PATRIMONIO</div>' +
    '<p class="msg" style="margin-top:10px">' + esc(manchete) + '</p></div></div>';

  h += sec('o ano de cada ativo', r.clubes.length + ' clube' + (r.clubes.length === 1 ? '' : 's'));
  r.clubes.forEach(x => {
    const dv = x.valorDepois - x.valorAntes, dn = x.nivelDepois - x.nivelAntes;
    const badge = x.campeao ? tag('campeao da ' + x.div, 'v')
      : x.subiu ? tag('acesso a ' + x.divNova, 'v')
        : x.desceu ? tag('rebaixado para ' + x.divNova, 'r')
          : tag('segue na ' + x.div, 'n');
    let conta;
    if (x.saldo >= 0) conta = 'Arrecadou ' + moeda(x.rec.total) + ' e gastou ' + moeda(x.des.total) + '. A sobra de ' + moeda(x.saldo) + ' entrou no caixa do clube.';
    else if (x.calote) conta = 'Arrecadou ' + moeda(x.rec.total) + ' e gastou ' + moeda(x.des.total) + '. Faltou dinheiro: ' + moeda(x.calote) + ' viraram divida do clube.';
    else conta = 'Arrecadou ' + moeda(x.rec.total) + ' e gastou ' + moeda(x.des.total) + '. O fundo cobriu o rombo de ' + moeda(-x.saldo) + '.';
    const parado = Math.abs(dv) < 1e5;
    let valorTxt;
    if (parado) valorTxt = 'O ativo continua valendo o mesmo.';
    else if (dv > 0) valorTxt = 'O ativo valorizou ' + moeda(dv) + '.';
    else valorTxt = 'O ativo desvalorizou ' + moeda(-dv) + '.';
    const aberto = !!UI.relDet[x.id];
    h += '<div class="panel"><div class="hd"><span>' + esc(x.nome) + '</span><b>' + x.pos + 'O LUGAR</b></div>' +
      '<div class="bd" style="padding:11px 11px 0">' + badge + '</div>' +
      '<div class="stats c3" style="border-top:1px solid var(--line);margin-top:11px">' +
      celula('Resultado', moeda(x.saldo), x.saldo >= 0 ? 'sobrou' : 'faltou', x.saldo >= 0 ? 'ok' : 'neg') +
      celula('Forca', String(x.nivelDepois), dn === 0 ? 'sem mudanca' : (dn > 0 ? '+' + dn : String(dn)) + ' no ano', dn > 0 ? 'ok' : dn < 0 ? 'neg' : '') +
      celula('Valor do ativo', moeda(x.valorDepois), varTxt(dv), parado ? '' : dv > 0 ? 'ok' : 'neg') +
      '</div><div class="bd" style="padding:11px">' +
      '<p class="msg">' + esc(conta) + ' ' + esc(valorTxt) + '</p>' +
      '<div class="gap"></div><button class="btn sec2 sm" data-a="reldet:' + x.id + '">' + (aberto ? 'Esconder as contas' : 'Ver as contas da temporada') + '</button>' +
      (aberto ? '<div class="gap"></div>' +
        ln('Bilheteria', moeda(x.rec.bilheteria), 'ok') + ln('Socio-torcedor', moeda(x.rec.socios), 'ok') +
        ln('Direitos de TV', moeda(x.rec.tv), 'ok') + ln('Patrocinio', moeda(x.rec.patrocinio), 'ok') +
        ln('Premiacao', moeda(x.rec.premiacao), 'ok', x.pos + 'o lugar') + ln('Vendas da base', moeda(x.rec.vendasBase), 'ok') +
        lnTot('Receita', moeda(x.rec.total), 'ok') +
        '<div class="gap"></div>' +
        ln('Folha do elenco', moeda(x.des.folha), 'neg') + ln('Manutencao do elenco', moeda(x.des.manutencao), 'neg') +
        ln('Comissao tecnica', moeda(x.des.comissao), 'neg') + ln('Operacao', moeda(x.des.operacao), 'neg') +
        ln('Manutencao do estadio', moeda(x.des.estadio), 'neg') + ln('Juros da divida', moeda(x.des.juros), 'neg') +
        lnTot('Despesa', moeda(x.des.total), 'neg') : '') +
      '</div></div><div class="gap"></div>';
  });

  const ativos = meus().reduce((t, a) => t + valorMercado(a, S.clubes[a.id]).liquido, 0);
  const caixaClubes = meus().reduce((t, a) => t + a.caixa, 0);
  const dRep = Math.round(f.reputacao - f.reputacaoAntes);
  h += sec('como o fundo fechou') +
    '<div class="panel"><div class="stats c3">' +
    celula('Caixa', moeda(f.caixa), varTxt(f.caixa - f.caixaAntes)) +
    celula('Divida', moeda(f.divida), f.juros > 0 ? moeda(f.juros) + ' de juros' : 'sem juros', f.divida > 0 ? 'neg' : '') +
    celula('Reputacao', Math.round(f.reputacao) + '/100', dRep === 0 ? 'estavel' : (dRep > 0 ? '+' + dRep : String(dRep)), dRep > 0 ? 'ok' : dRep < 0 ? 'neg' : '') +
    '</div><div class="bd">' +
    ln('Valor dos clubes', moeda(ativos), 'ok') +
    ln('Caixa dos clubes', moeda(caixaClubes), 'ok') +
    ln('Caixa do fundo', moeda(f.caixa), 'ok') +
    ln('Divida do fundo', moeda(-f.divida), f.divida > 0 ? 'neg' : '') +
    lnTot('Patrimonio liquido', moeda(f.patrimonio), 'ok') + '</div></div>';

  h += '<div class="gap"></div><button class="btn" data-a="fecharrel">Abrir a pre-temporada ' + S.temporada + ' ' + ic('seta') + '</button>';
  return h + '</div>';
}

/* ---------------- render ---------------- */
function render() {
  const app = el('app');
  if (!S) { app.innerHTML = TELA === 'criacao' ? telaCriacao() : telaInicio(); restaurarFoco(); return; }
  if (S.fase === 'relatorio') {
    const y = ULTIMA === 'rel-fechamento' ? window.scrollY : 0;
    app.innerHTML = topo() + telaRelatorio();
    window.scrollTo(0, y);
    ULTIMA = 'rel-fechamento';
    return;
  }
  const chave = [TELA, UI.abaClube, UI.clube, UI.alvo, UI.divLiga, UI.visaoLiga].join('|');
  if (chave === ULTIMA) SCROLL[chave] = window.scrollY;
  let corpo = '';
  if (TELA === 'clubes') corpo = telaClubes();
  else if (TELA === 'mercado') corpo = telaMercado();
  else if (TELA === 'ligas') corpo = telaLigas();
  else if (TELA === 'rel') corpo = telaRel();
  else corpo = telaFundo();
  app.innerHTML = topo() + corpo + nav();
  if (chave === ULTIMA) window.scrollTo(0, SCROLL[chave] || 0); else window.scrollTo(0, 0);
  ULTIMA = chave;
  restaurarFoco();
}
function restaurarFoco() {
  if (!UI.foco) return;
  const e = el(UI.foco);
  UI.foco = null;
  if (!e) return;
  e.focus();
  try { e.setSelectionRange(e.value.length, e.value.length); } catch (err) { }
}
function abrirModal(h) { el('modal').innerHTML = '<div class="mod" data-a="fechar-fundo"><div>' + h + '</div></div>'; }
function fecharModal() { el('modal').innerHTML = ''; }
function alerta(t, p) {
  abrirModal('<h3>' + esc(t) + '</h3><p class="msg" style="margin:9px 0 14px">' + esc(p) + '</p>' +
    '<button class="btn sec2" data-a="fechar">Entendi</button>');
}
function modalValor(titulo, texto, maximo, acao) {
  if (!maximo || maximo < 1e5) { alerta(titulo, 'Nao ha valor disponivel para essa operacao agora.'); return; }
  abrirModal('<h3>' + esc(titulo) + '</h3><p class="msg" style="margin:8px 0 12px">' + esc(texto) + '</p>' +
    [['1', 'tudo'], ['0.5', 'metade'], ['0.25', 'um quarto']].map(f =>
      '<button class="btn ' + (f[0] === '1' ? '' : 'gh') + '" style="margin-bottom:7px" data-a="' + acao + ':' + Math.floor(maximo * Number(f[0])) + '">' +
      moeda(maximo * Number(f[0])) + ' (' + f[1] + ')</button>').join('') +
    '<button class="btn sec2" data-a="fechar">Cancelar</button>');
}

/* ---------------- selects e busca ---------------- */
document.addEventListener('change', e => {
  const alvo = e.target.closest('[data-s]');
  if (!alvo) return;
  const v = alvo.value;
  switch (alvo.dataset.s) {
    case 'criadiv': capturaNome(); UI.criaDiv = v === 'todas' ? 'todas' : Number(v); break;
    case 'criaord': capturaNome(); UI.criaOrd = v; break;
    case 'selclube': UI.clube = Number(v); break;
    case 'manut': ativo(UI.clube).manut = Number(v); salvar(); break;
    case 'tec': { const a = ativo(UI.clube); a.tecnico = Number(v); sincronizar(a); salvar(); break; }
    case 'alavf': UI.alavFiltro = v; break;
    case 'mercdiv': UI.mercDiv = v === 'alc' ? 'alc' : Number(v); break;
    case 'mercord': UI.mercOrd = v; break;
    case 'mercfx': UI.mercFaixa = v; break;
    case 'divliga': UI.divLiga = Number(v); break;
    case 'visaoliga': UI.visaoLiga = v; break;
    case 'radar': UI.radar = v; break;
    case 'relf': UI.relFiltro = v === 'todas' ? 'todas' : Number(v); break;
  }
  render();
});
document.addEventListener('input', e => {
  const alvo = e.target.closest('[data-i]');
  if (!alvo) return;
  if (alvo.dataset.i === 'mercbusca') { UI.mercBusca = alvo.value; UI.foco = 'busca'; render(); }
});
function capturaNome() { const e = el('nome'); if (e) UI.nome = e.value; }

/* ---------------- acoes ---------------- */
document.addEventListener('click', e => {
  const alvo = e.target.closest('[data-a]');
  if (!alvo) return;
  const [a, p1, p2] = alvo.dataset.a.split(':');
  if (a === 'fechar-fundo' && e.target !== alvo) return;
  switch (a) {
    case 'criar':
      if (DB.get(CHAVE) && !S) {
        abrirModal('<h3>Comecar de novo</h3><p class="msg" style="margin:9px 0 14px">Ja existe um fundo salvo neste aparelho. Abrir um novo apaga o anterior.</p>' +
          '<button class="btn warn" data-a="criar-ok">Abrir mesmo assim</button><div class="gap"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
        break;
      }
    /* falls through */
    case 'criar-ok': fecharModal(); MUNDO = criarMundo(); UI.clube = null; UI.criaDiv = 'todas'; UI.criaOrd = 'preco'; UI.nome = ''; TELA = 'criacao'; render(); break;
    case 'voltar-inicio': capturaNome(); TELA = 'inicio'; render(); break;
    case 'continuar': if (carregar()) { TELA = 'fundo'; render(); } else alerta('Sem fundo salvo', 'Nao encontrei um jogo salvo neste aparelho.'); break;
    case 'pre': capturaNome(); UI.clube = Number(p1); render(); break;
    case 'fundar': {
      capturaNome();
      const nome = (UI.nome || '').trim() || 'Fundo Sem Nome';
      const err = novoFundo(nome, UI.clube);
      if (err) { alerta('Nao deu', err); break; }
      TELA = 'fundo'; UI.abaClube = 'painel'; render(); break;
    }
    case 'nav': TELA = p1; UI.alvo = null; render(); break;
    case 'iniciar': iniciarTemporada(); render(); break;
    case 'avancar': avancar(Number(p1)); render(); break;
    case 'pular': pularFim(); render(); break;
    case 'reldet': UI.relDet[p1] = !UI.relDet[p1]; render(); break;
    case 'fecharrel': UI.relDet = {}; fecharRelatorio(); TELA = 'fundo'; render(); break;
    case 'verclube': UI.clube = Number(p1); TELA = 'clubes'; render(); break;
    case 'abaclube': UI.abaClube = p1; render(); break;
    case 'ingresso': { const at = ativo(UI.clube); at.ingresso = clamp(at.ingresso + Number(p1), 5, 400); salvar(); render(); break; }
    case 'alav': { const err = aplicarAlavanca(ativo(UI.clube), p1); if (err) alerta('Nao deu', err); else { salvar(); render(); } break; }
    case 'aportar': modalValor('Aportar no clube', 'Dinheiro do fundo para o caixa do clube.', S.f.caixa, 'aportar-ok'); break;
    case 'aportar-ok': { fecharModal(); const err = aportar(ativo(UI.clube), Number(p1)); if (err) alerta('Nao deu', err); else render(); break; }
    case 'retirar': modalValor('Sacar dividendo', 'Tira do caixa do clube e leva para o fundo.', ativo(UI.clube).caixa, 'retirar-ok'); break;
    case 'retirar-ok': { fecharModal(); const err = retirar(ativo(UI.clube), Number(p1)); if (err) alerta('Nao deu', err); else render(); break; }
    case 'quitarclube': { const at = ativo(UI.clube); modalValor('Quitar divida do clube', 'Tira juros e destrava o valor do ativo.', Math.min(at.divida, at.caixa + S.f.caixa), 'quitarclube-ok'); break; }
    case 'quitarclube-ok': { fecharModal(); const err = quitarDividaClube(ativo(UI.clube), Number(p1)); if (err) alerta('Nao deu', err); else render(); break; }
    case 'emprestimo': modalValor('Tomar credito', 'Entra no caixa agora e custa 11% ao ano ate ser quitado.', limiteCredito(), 'emprestimo-ok'); break;
    case 'emprestimo-ok': { fecharModal(); const err = tomarEmprestimo(Number(p1)); if (err) alerta('Nao deu', err); else render(); break; }
    case 'quitarfundo': modalValor('Abater divida do fundo', 'Usa o caixa livre para reduzir os juros.', Math.min(S.f.divida, S.f.caixa), 'quitarfundo-ok'); break;
    case 'quitarfundo-ok': { fecharModal(); const err = quitarDividaFundo(Number(p1)); if (err) alerta('Nao deu', err); else render(); break; }
    case 'tgcrise': UI.mercCrise = !UI.mercCrise; render(); break;
    case 'tgdd': UI.mercDD = !UI.mercDD; render(); break;
    case 'alvo': UI.alvo = Number(p1); render(); break;
    case 'voltarmerc': UI.alvo = null; render(); break;
    case 'dd': { const err = fazerDD(Number(p1)); if (err) alerta('Nao deu', err); else render(); break; }
    case 'ofertar': {
      const id = Number(p1), c = S.clubes[id], of = ofertas(id).filter(o => o.id === p2)[0];
      abrirModal('<h3>' + esc(c.nome) + '</h3>' +
        ln('Sua oferta', moeda(of.v)) +
        ln('Chance de aceite', of.risco ? Math.round(chanceAceite(id) * 100) + '%' : '100%') +
        ln('Caixa depois da compra', moeda(S.f.caixa - of.v), S.f.caixa - of.v < 0 ? 'neg' : '') +
        (S.dd[id] ? '' : '<p class="msg" style="margin:10px 0 0">Sem due diligence: a divida real so aparece depois de assinar.</p>') +
        (temNaLiga(c.div) ? '<p class="msg" style="margin:10px 0 0">Segundo clube na mesma liga: <b>-10 de reputacao</b>.</p>' : '') +
        '<div class="gap"></div><button class="btn" data-a="ofertar-ok:' + id + ':' + p2 + '">Enviar proposta</button>' +
        '<div class="gap"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
      break;
    }
    case 'ofertar-ok': {
      fecharModal();
      const id = Number(p1), err = comprarClube(id, p2);
      if (err) { alerta('Nao rolou', err); render(); }
      else { UI.alvo = null; UI.clube = id; TELA = 'clubes'; UI.abaClube = 'painel'; render(); }
      break;
    }
    case 'vender': {
      const at = ativo(UI.clube), c = S.clubes[UI.clube], b = balanco(at);
      abrirModal('<h3>Vender o ' + esc(c.nome) + '</h3>' +
        ln('Voce recebe', moeda(valorVenda(at) + at.caixa)) +
        ln('Total investido', moeda(b.investido), 'neg') +
        ln('Ja sacado', moeda(at.retirado || 0), 'ok') +
        lnTot(b.resultado >= 0 ? 'Lucro do projeto' : 'Prejuizo do projeto', moeda(Math.abs(b.resultado)), b.resultado >= 0 ? 'ok' : 'neg') +
        '<p class="msg" style="margin:10px 0 12px">Nao da para desfazer.</p>' +
        '<button class="btn warn" data-a="vender-ok">Vender</button>' +
        '<div class="gap"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
      break;
    }
    case 'vender-ok': {
      fecharModal();
      const err = venderClube(UI.clube);
      if (err) alerta('Nao deu', err); else { UI.clube = null; TELA = 'fundo'; render(); }
      break;
    }
    case 'apagar':
      abrirModal('<h3>Apagar o fundo</h3><p class="msg" style="margin:9px 0 14px">Isso remove o jogo salvo neste aparelho.</p>' +
        '<button class="btn dgr" data-a="apagar-ok">Apagar</button><div class="gap"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
      break;
    case 'apagar-ok': fecharModal(); apagar(); break;
    case 'fechar': case 'fechar-fundo': fecharModal(); break;
  }
});

(function () { if (carregar()) { TELA = 'fundo'; render(); } else render(); })();

</script>
</body>
</html>
